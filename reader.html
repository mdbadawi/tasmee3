/* =========================================================
   Manual Active-Recall Recitation / Statistics
   ========================================================= */
const RECITATION_KEY="tasmee3_recitation_v1";
const WEAKNESS_MARKS_KEY="tasmee3_weakness_marks_v1";
let recitationData=loadRecitationData();
let activeSession=recitationData.activeSession || null;
let recitationMode=!!activeSession;
let weaknessMarksEnabled=localStorage.getItem(WEAKNESS_MARKS_KEY)!=="0";
let toastTimer=null;
let recitationSaveTimer=null;

/*
  current     = Weakness Score الحالي بعد الشفاء.
  all         = كل الجلسات المنتهية التي تحتوي أحداثا لهذه السورة.
  session     = جلسة تاريخية واحدة.
  active      = الجلسة الجارية فقط، إن وجدت.
*/
let weaknessReplayMode="current";
let weaknessReplaySessionId=null;
let weaknessReplayLabel="الحالة الحالية";


function defaultMetric(){
  return {visits:0,pagesReviewed:0,wordAssists:0,ayahAssists:0,manualErrors:0,repeated:0,healed:0};
}
function defaultRecitationData(){
  return {
    version:3,
    activeSession:null,
    sessions:[],
    words:{},
    ayahs:{},
    ayahText:{},
    aggregate:{
      totalSessions:0,
      wordAssists:0,
      ayahAssists:0,
      manualErrors:0,
      repeated:0,
      healed:0,
      pagesReviewed:0,
      byPage:{},
      byJuz:{},
      byHizb:{}
    },
    khatmah:{
      current:{number:1,startedAt:null,pages:{},wordAssists:0,ayahAssists:0,manualErrors:0,repeated:0,healed:0},
      completed:[]
    }
  };
}
function loadRecitationData(){
  try{
    const raw=JSON.parse(localStorage.getItem(RECITATION_KEY)||"null");
    if(!raw || typeof raw!=="object") return defaultRecitationData();
    const d=Object.assign(defaultRecitationData(),raw);
    d.words=d.words||{};
    d.ayahs=d.ayahs||{};
    d.ayahText=d.ayahText||{};
    d.sessions=Array.isArray(d.sessions)?d.sessions:[];
    d.aggregate=Object.assign(defaultRecitationData().aggregate,d.aggregate||{});
    d.aggregate.byPage=d.aggregate.byPage||{};
    d.aggregate.byJuz=d.aggregate.byJuz||{};
    d.aggregate.byHizb=d.aggregate.byHizb||{};
    d.khatmah=d.khatmah||defaultRecitationData().khatmah;
    d.khatmah.completed=Array.isArray(d.khatmah.completed)?d.khatmah.completed:[];
    d.khatmah.current=Object.assign(defaultRecitationData().khatmah.current,d.khatmah.current||{});
    d.khatmah.current.pages=d.khatmah.current.pages||{};
    return d;
  }catch(e){
    return defaultRecitationData();
  }
}
function saveRecitationData(){
  try{
    recitationData.activeSession=activeSession;
    localStorage.setItem(RECITATION_KEY,JSON.stringify(recitationData));
  }catch(e){
    console.warn("Recitation storage failed",e);
    showRecitationToast("تعذر حفظ إحصاءات التسميع في مساحة المتصفح");
  }
}
function scheduleRecitationSave(){
  clearTimeout(recitationSaveTimer);
  recitationSaveTimer=setTimeout(()=>{
    recitationSaveTimer=null;
    saveRecitationData();
  },220);
}

function wordKey(t){
  if(!t) return "";
  return `${SURAH.number}:${t.verse}:${t.position||0}`;
}
function ayahKey(verse,surahNo=SURAH.number){
  return `${surahNo}:${verse}`;
}
function tokenMeta(t){
  if(!t) return null;
  return {
    surah:SURAH.number,
    verse:Number(t.verse)||0,
    position:Number(t.position)||0,
    page:Number(t.page)||0,
    line:Number(t.line)||0,
    juz:Number(t.juz)||juzFromPage(Number(t.page)||1),
    hizb:Number(t.hizb)||hizbFallback(Number(t.page)||1),
    text:t.text_uthmani||t.text_qpc_hafs||""
  };
}

function ayahSnapshotKey(surahNo,verse){
  return `${Number(surahNo)||0}:${Number(verse)||0}`;
}
function buildCurrentAyahSnapshot(verse){
  const words=tokensOfAyah(Number(verse)).map(t=>({
    position:Number(t.position)||0,
    text:t.text_uthmani||t.text_qpc_hafs||""
  })).filter(x=>x.text);

  if(!words.length) return null;

  return {
    surah:SURAH.number,
    verse:Number(verse)||0,
    text:words.map(w=>w.text).join(" "),
    words
  };
}
function ensureAyahSnapshot(verse){
  recitationData.ayahText=recitationData.ayahText||{};
  const key=ayahSnapshotKey(SURAH.number,verse);

  if(!recitationData.ayahText[key]){
    const snap=buildCurrentAyahSnapshot(verse);
    if(snap) recitationData.ayahText[key]=snap;
  }

  return recitationData.ayahText[key]||null;
}
function getAyahSnapshot(surahNo,verse){
  recitationData.ayahText=recitationData.ayahText||{};
  const key=ayahSnapshotKey(surahNo,verse);

  if(Number(surahNo)===Number(SURAH.number) && !recitationData.ayahText[key]){
    ensureAyahSnapshot(verse);
  }

  return recitationData.ayahText[key]||null;
}
function backfillCurrentSurahAyahSnapshots(){
  let changed=false;

  const remember=(m)=>{
    if(!m || Number(m.surah)!==Number(SURAH.number) || !Number(m.verse)) return;
    const key=ayahSnapshotKey(m.surah,m.verse);
    if(!recitationData.ayahText?.[key]){
      const snap=buildCurrentAyahSnapshot(m.verse);
      if(snap){
        recitationData.ayahText[key]=snap;
        changed=true;
      }
    }
  };

  Object.values(recitationData.words||{}).forEach(w=>remember(w.meta));
  Object.values(recitationData.ayahs||{}).forEach(w=>remember(w.meta));
  (activeSession?.events||[]).forEach(e=>remember(e.meta));
  (recitationData.sessions||[]).forEach(s=>(s.events||[]).forEach(e=>remember(e.meta)));

  if(changed) saveRecitationData();
}

function juzFromPage(page){
  const starts=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
  let j=1;
  for(let i=0;i<starts.length;i++){
    if(page>=starts[i]) j=i+1; else break;
  }
  return j;
}
function hizbFallback(page){
  /* يستخدم فقط إذا لم يرسل API hizb_number؛ الإحصاءات الدقيقة تستعمل قيمة الآية متى وجدت. */
  return Math.max(1,Math.min(60,Math.floor((Math.max(1,page)-1)*60/604)+1));
}
function tokensOfAyah(verse){
  const s=ayahStarts[verse],e=ayahEnds[verse];
  if(s===undefined||e===undefined) return [];
  return hideable.slice(s,e);
}
function captureReaderPosition(){
  const t=currentBoundaryToken();
  return {
    surah:SURAH.number,
    page:currentNavPage||t?.page||FIRST_PAGE,
    ayah:t?.verse||1,
    visibleCount,
    cursorTokenIndex,
    cursorVerse,
    activePage
  };
}
function restoreReaderPosition(pos){
  if(!pos || Number(pos.surah)!==SURAH.number) return;
  visibleCount=Math.max(0,Math.min(hideable.length,Number(pos.visibleCount)||0));
  cursorTokenIndex=Math.max(0,Math.min(hideable.length-1,Number(pos.cursorTokenIndex)||0));
  cursorVerse=Number(pos.cursorVerse)||hideable[cursorTokenIndex]?.verse||1;
  currentNavPage=Math.max(FIRST_PAGE,Math.min(LAST_PAGE,Number(pos.page)||FIRST_PAGE));
  document.getElementById("pageInput").value=currentNavPage;
  document.getElementById("ayahInput").value=cursorVerse;
  updateVisibility();
  if(autoScroll){
    const el=pageElement(currentNavPage); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
  }else{
    turnToPage(currentNavPage,currentNavPage>=activePage?1:-1,false);
  }
}

function newSession(){
  const now=Date.now();
  const startToken=currentBoundaryToken() || hideable[visibleCount] || hideable[0] || null;
  const startMeta=tokenMeta(startToken)||{surah:SURAH.number,verse:1,page:FIRST_PAGE,juz:juzFromPage(FIRST_PAGE),hizb:hizbFallback(FIRST_PAGE)};
  return {
    id:`s-${now}-${Math.random().toString(36).slice(2,7)}`,
    startedAt:now,
    start:startMeta,
    pages:{},
    pageMeta:{},
    coverageJuz:{},
    coverageHizb:{},
    events:[],
    passedWordKeys:{},
    passedAyahKeys:{},
    cleanWordCandidates:{},
    cleanAyahCandidates:{},
    currentCleanWords:0,
    longestCleanWords:0
  };
}
function startRecitationSession(){
  if(weaknessReplayMode!=="current"){
    setWeaknessReplay("current",{toast:false});
  }

  if(activeSession){
    recitationMode=true;
    applyRecitationModeUI();
    return;
  }
  activeSession=newSession();
  recitationMode=true;
  trackSessionToken(currentBoundaryToken());
  saveRecitationData();
  applyRecitationModeUI();
  showRecitationToast("بدأت جلسة تسميع جديدة");
}
function isTokenBeforeSessionStart(t){
  if(!activeSession||!t||!activeSession.start) return false;
  const s=activeSession.start;
  if(Number(t.page)<Number(s.page)) return true;
  if(Number(t.page)>Number(s.page)) return false;
  if(Number(SURAH.number)<Number(s.surah)) return true;
  if(Number(SURAH.number)>Number(s.surah)) return false;
  if(Number(t.verse)<Number(s.verse)) return true;
  if(Number(t.verse)>Number(s.verse)) return false;
  return Number(t.position||0)<Number(s.position||0);
}
function trackSessionToken(t){
  if(!recitationMode||!activeSession||!t) return;
  trackSessionPageByNumber(Number(t.page),t);
  const meta=tokenMeta(t);
  activeSession.coverageJuz=activeSession.coverageJuz||{};
  activeSession.coverageHizb=activeSession.coverageHizb||{};
  const j=String(meta.juz||juzFromPage(meta.page));
  const hz=String(meta.hizb||hizbFallback(meta.page));
  activeSession.coverageJuz[j]=activeSession.coverageJuz[j]||{};
  activeSession.coverageHizb[hz]=activeSession.coverageHizb[hz]||{};
  activeSession.coverageJuz[j][String(meta.page)]=1;
  activeSession.coverageHizb[hz][String(meta.page)]=1;
  scheduleRecitationSave();
}
function trackSessionPageByNumber(page,t=null){
  if(!recitationMode||!activeSession||!page) return;
  activeSession.pages=activeSession.pages||{};
  activeSession.pageMeta=activeSession.pageMeta||{};
  activeSession.coverageJuz=activeSession.coverageJuz||{};
  activeSession.coverageHizb=activeSession.coverageHizb||{};
  const fallback=t || (pageStarts[page]!==undefined ? hideable[pageStarts[page]] : null);
  const meta=tokenMeta(fallback)||{page,juz:juzFromPage(page),hizb:hizbFallback(page),surah:SURAH.number};
  activeSession.pages[String(page)]=1;
  activeSession.pageMeta[String(page)]={juz:meta.juz||juzFromPage(page),hizb:meta.hizb||hizbFallback(page)};
  const j=String(meta.juz||juzFromPage(page)),hz=String(meta.hizb||hizbFallback(page));
  activeSession.coverageJuz[j]=activeSession.coverageJuz[j]||{};
  activeSession.coverageHizb[hz]=activeSession.coverageHizb[hz]||{};
  activeSession.coverageJuz[j][String(page)]=1;
  activeSession.coverageHizb[hz][String(page)]=1;
  scheduleRecitationSave();
}
function markWordPassed(t){
  if(!recitationMode||!activeSession||!t) return;
  activeSession.passedWordKeys[wordKey(t)]=1;
  scheduleRecitationSave();
}
function markAyahPassed(verse){
  if(!recitationMode||!activeSession||!verse) return;
  activeSession.passedAyahKeys[ayahKey(verse)]=1;
  scheduleRecitationSave();
}
function alreadyPassedWord(t){
  if(!activeSession||!t) return false;
  return isTokenBeforeSessionStart(t) || !!activeSession.passedWordKeys[wordKey(t)];
}
function alreadyPassedAyah(verse){
  if(!activeSession||!verse) return false;
  const first=tokensOfAyah(verse)[0];
  return (first&&isTokenBeforeSessionStart(first)) || !!activeSession.passedAyahKeys[ayahKey(verse)];
}
function hasWordIncidentThisSession(key){
  if(!activeSession) return false;
  return activeSession.events.some(e=>(e.kind==="wordAssist"||e.kind==="manualError")&&e.key===key);
}
function hasAyahIncidentThisSession(verse){
  if(!activeSession) return false;
  return activeSession.events.some(e=>e.meta?.surah===SURAH.number && e.meta?.verse===Number(verse));
}

function getWordWeakness(t){
  return recitationData.words[wordKey(t)]||null;
}
function getAyahWeakness(verse){
  return recitationData.ayahs[ayahKey(verse)]||null;
}
function ensureWordWeakness(t){
  const key=wordKey(t);
  if(!recitationData.words[key]){
    recitationData.words[key]={
      key,
      meta:tokenMeta(t),
      score:0,
      totalWordAssists:0,
      totalManualErrors:0,
      recoveries:0,
      relapses:0,
      lastAt:null,
      lastIncidentSessionId:null
    };
  }
  return recitationData.words[key];
}
function ensureAyahWeakness(t){
  const key=ayahKey(t.verse);
  if(!recitationData.ayahs[key]){
    recitationData.ayahs[key]={
      key,
      meta:{surah:SURAH.number,verse:t.verse,page:t.page,juz:t.juz||juzFromPage(t.page),hizb:t.hizb||hizbFallback(t.page)},
      score:0,
      totalAyahAssists:0,
      recoveries:0,
      relapses:0,
      lastAt:null,
      lastIncidentSessionId:null
    };
  }
  return recitationData.ayahs[key];
}
function makeEvent(kind,key,t,before,repeated,relapse){
  const meta=tokenMeta(t);
  const snap=t?.verse ? ensureAyahSnapshot(t.verse) : null;

  return {
    id:`e-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
    kind,
    key,
    at:Date.now(),
    meta,
    ayahTextKey:snap ? ayahSnapshotKey(meta.surah,meta.verse) : null,
    before,
    repeated:!!repeated,
    relapse:!!relapse
  };
}
function recordWordAssist(t,before){
  if(!activeSession||!t) return null;
  const key=wordKey(t);

  /*
    زر Word Assist إشارة صريحة إلى أن المستخدم نسي هذه الكلمة.
    لذلك يُسمح بتسجيله حتى بعد الرجوع إلى موضع سبق المرور عليه.
    الرجوع للتأكد بلا تسجيل يتم بالسهم العادي، لا بزر المساعدة.
  */
  if(hasWordIncidentThisSession(key)){
    showRecitationToast("الموضع مسجل بالفعل في هذه الجلسة");
    return null;
  }
  const w=ensureWordWeakness(t);
  const historical=(w.totalWordAssists+w.totalManualErrors)>0;
  const relapse=w.score===0 && historical;
  const repeated=w.score>0 || historical;
  w.score=(Number(w.score)||0)+1;
  w.totalWordAssists=(Number(w.totalWordAssists)||0)+1;
  if(relapse) w.relapses=(Number(w.relapses)||0)+1;
  w.lastAt=Date.now(); w.lastIncidentSessionId=activeSession.id;
  delete activeSession.cleanWordCandidates[key];
  delete activeSession.cleanAyahCandidates[ayahKey(t.verse)];
  activeSession.currentCleanWords=0;
  const ev=makeEvent("wordAssist",key,t,before,repeated,relapse);
  activeSession.events.push(ev);
  saveRecitationData(); updateWeaknessHighlights(); updateSessionControls();
  showRecitationToast(`Word Assist +1 — الآية ${t.verse}، الكلمة ${t.position}`);
  return ev;
}
function recitationAyahAssistTargetVerse(){
  // الحالة الأهم: رجع المستخدم آية للخلف، فأصبح المؤشر عند بدايتها وهي مخفية.
  const cursorA=Number(cursorVerse)||0;
  if(
    cursorA>0 &&
    ayahStarts[cursorA]!==undefined &&
    Number(ayahStarts[cursorA])===Number(visibleCount)
  ){
    return cursorA;
  }

  // الحالة العادية: الآية التالية عند حد الإظهار.
  const next=hideable[visibleCount];
  if(next?.verse) return Number(next.verse);

  // عند نهاية السورة، نرجع للآية التي يشير إليها المؤشر.
  const current=currentBoundaryToken();
  return Number(current?.verse)||cursorA||0;
}

function applyCurrentSessionAyahAssistMarks(){
  if(weaknessReplayMode!=="current"){
    document.querySelectorAll(".verse-end.session-ayah-assist")
      .forEach(el=>el.classList.remove("session-ayah-assist"));
    return;
  }

  document.querySelectorAll(".verse-end").forEach(el=>{
    el.classList.remove("session-ayah-assist");
    if(!activeSession) return;

    const verse=Number(el.dataset.verse)||0;
    if(!verse) return;

    const key=ayahKey(verse);
    const used=activeSession.events.some(
      e=>e.kind==="ayahAssist" && e.key===key
    );

    if(used) el.classList.add("session-ayah-assist");
  });
}

function revealSpecificAyahForAssist(verse){
  verse=Number(verse)||0;
  if(!verse || ayahStarts[verse]===undefined || ayahEnds[verse]===undefined) return null;

  const start=Number(ayahStarts[verse]);
  const end=Number(ayahEnds[verse]);

  /*
    إذا كانت الآية هي الآية المخفية عند حد الإظهار، نكشفها.
    إذا كانت ظاهرة بالفعل فلا نغير visibleCount؛ التسجيل يظل صالحا.
  */
  if(Number(visibleCount)===start){
    visibleCount=end;
  }

  const lastIndex=Math.max(start,Math.min(hideable.length-1,end-1));
  const last=hideable[lastIndex]||hideable[start]||null;

  if(last){
    setCursorToken(lastIndex);
  }else{
    cursorVerse=verse;
    document.getElementById("ayahInput").value=verse;
  }

  updateVisibility();

  if(autoScroll){
    controlsToBottom();
    scrollToAyah(verse);
    syncPageFieldFromViewport();
  }else if(last){
    syncManualDisplayToToken(last);
  }

  return last;
}

function performAyahAssist(){
  if(!recitationMode || !activeSession) return;

  const verse=recitationAyahAssistTargetVerse();
  if(!verse) return;

  const first=tokensOfAyah(verse)[0] || hideable[ayahStarts[verse]];
  if(!first) return;

  const before=captureReaderPosition();

  // نسجل الحدث أولا، مستقلا عن منطق "الآية التالية".
  const event=recordAyahAssist(first,before);

  // حتى لو كان الحدث مسجلا سابقا في نفس الجلسة، نظهر الموضع المقصود بوضوح.
  revealSpecificAyahForAssist(verse);

  markAyahPassed(verse);
  tokensOfAyah(verse).forEach(markWordPassed);
  tokensOfAyah(verse).forEach(trackSessionToken);

  if(event){
    event.after=captureReaderPosition();
  }

  saveReaderState();
  saveRecitationData();

  // نعيد تطبيق العلامة بعد كل تغييرات العرض، وليس قبلها.
  updateWeaknessHighlights();
  applyCurrentSessionAyahAssistMarks();

  requestAnimationFrame(()=>{
    updateWeaknessHighlights();
    applyCurrentSessionAyahAssistMarks();
    flashAyahAssistMarker(verse);
  });

  updateSessionControls();
  updateControlsPositionByPage();
}

function recordAyahAssist(t,before){
  if(!activeSession||!t) return null;
  const a=t.verse;
  const key=ayahKey(a);

  /*
    زر Ayah Assist = "نسيت هذه الآية" بصورة صريحة.
    إذا رجع المستخدم آية للخلف ثم ضغطه يجب أن تُسجل وتُلوّن.
    أما إظهار آية سابقة بالسهم العادي فيظل مجرد مراجعة ولا يحسب.
  */
  if(activeSession.events.some(e=>e.kind==="ayahAssist"&&e.key===key)){
    updateWeaknessHighlights();
    applyCurrentSessionAyahAssistMarks();
    requestAnimationFrame(()=>flashAyahAssistMarker(a));
    showRecitationToast(`مساعدة الآية ${a} مسجلة بالفعل`);
    return null;
  }
  const w=ensureAyahWeakness(t);
  const historical=(w.totalAyahAssists||0)>0;
  const relapse=w.score===0 && historical;
  const repeated=w.score>0 || historical;
  w.score=(Number(w.score)||0)+1;
  w.totalAyahAssists=(Number(w.totalAyahAssists)||0)+1;
  if(relapse) w.relapses=(Number(w.relapses)||0)+1;
  w.lastAt=Date.now(); w.lastIncidentSessionId=activeSession.id;
  delete activeSession.cleanAyahCandidates[key];
  tokensOfAyah(a).forEach(x=>delete activeSession.cleanWordCandidates[wordKey(x)]);
  activeSession.currentCleanWords=0;
  const ev=makeEvent("ayahAssist",key,t,before,repeated,relapse);
  activeSession.events.push(ev);
  saveRecitationData(); updateWeaknessHighlights(); updateSessionControls();
  showRecitationToast(`Ayah Assist +1 — الآية ${a}`);
  return ev;
}
function manualErrorTargetToken(){
  /*
    Manual Error = "قلت الكلمة الظاهرة الأخيرة خطأ".
    لذلك لا يلمس الكلمة التالية المخفية إطلاقا.
  */
  if(Number(visibleCount)<=0) return null;

  const idx=Math.min(Number(visibleCount)-1,hideable.length-1);
  return idx>=0 ? (hideable[idx]||null) : null;
}
function flashWordAssistToken(t){
  if(!t) return;
  const el=document.querySelector(`.word[data-hide-index="${Number(t.hideIndex)}"]`);
  if(!el) return;

  el.classList.remove("assist-flash");
  void el.offsetWidth;
  el.classList.add("assist-flash");
  setTimeout(()=>el.classList.remove("assist-flash"),1100);
}
function flashAyahAssistMarker(verse){
  if(!verse) return;
  const el=document.querySelector(`.verse-end[data-verse="${Number(verse)}"]`);
  if(!el) return;

  el.classList.remove("ayah-assist-flash");
  void el.offsetWidth;
  el.classList.add("ayah-assist-flash");
  setTimeout(()=>el.classList.remove("ayah-assist-flash"),1200);
}

function flashManualErrorToken(t){
  if(!t) return;

  const el=document.querySelector(`.word[data-hide-index="${Number(t.hideIndex)}"]`);
  if(!el) return;

  el.classList.remove("manual-error-flash");
  void el.offsetWidth;
  el.classList.add("manual-error-flash");

  setTimeout(()=>el.classList.remove("manual-error-flash"),950);
}
function recordManualError(){
  if(!recitationMode||!activeSession) return;

  const t=manualErrorTargetToken();
  if(!t){
    showRecitationToast("لا توجد كلمة ظاهرة لتسجيل الخطأ عليها");
    return;
  }

  const key=wordKey(t);

  if(hasWordIncidentThisSession(key)){
    // لا نضاعف Word Assist + Manual Error على الكلمة نفسها.
    flashManualErrorToken(t);
    showRecitationToast("الكلمة مسجلة بالفعل؛ لم يتكرر الحدث");
    return;
  }

  const before=captureReaderPosition();
  const w=ensureWordWeakness(t);
  const historical=(w.totalWordAssists+w.totalManualErrors)>0;
  const relapse=w.score===0 && historical;
  const repeated=w.score>0 || historical;

  w.score=(Number(w.score)||0)+1;
  w.totalManualErrors=(Number(w.totalManualErrors)||0)+1;

  if(relapse) w.relapses=(Number(w.relapses)||0)+1;

  w.lastAt=Date.now();
  w.lastIncidentSessionId=activeSession.id;

  delete activeSession.cleanWordCandidates[key];
  delete activeSession.cleanAyahCandidates[ayahKey(t.verse)];
  activeSession.currentCleanWords=0;

  const ev=makeEvent("manualError",key,t,before,repeated,relapse);
  activeSession.events.push(ev);

  /*
    لا نغير visibleCount ولا نكشف أي كلمة.
    الكلمة المستهدفة ظاهرة بالفعل؛ نكتفي بالتسجيل والتأكيد البصري.
  */
  trackSessionToken(t);
  flashManualErrorToken(t);

  saveRecitationData();
  updateWeaknessHighlights();
  updateSessionControls();

  showRecitationToast(`خطأ يدوي +1 — الآية ${t.verse}، الكلمة ${t.position}`);
}

function noteCleanWordProgress(t){
  if(!recitationMode||!activeSession||!t) return;
  const w=getWordWeakness(t);
  const key=wordKey(t);
  if(w && w.score>0 && w.lastIncidentSessionId!==activeSession.id && !hasWordIncidentThisSession(key)){
    activeSession.cleanWordCandidates[key]=tokenMeta(t);
  }
  activeSession.currentCleanWords=(Number(activeSession.currentCleanWords)||0)+1;
  activeSession.longestCleanWords=Math.max(Number(activeSession.longestCleanWords)||0,activeSession.currentCleanWords);
  maybeCleanAyahOnCompletion(t);
  scheduleRecitationSave();
}
function noteCleanAyahProgress(verse){
  if(!recitationMode||!activeSession||!verse) return;
  const ts=tokensOfAyah(verse);
  for(const t of ts){
    const w=getWordWeakness(t),key=wordKey(t);
    if(w && w.score>0 && w.lastIncidentSessionId!==activeSession.id && !hasWordIncidentThisSession(key)){
      activeSession.cleanWordCandidates[key]=tokenMeta(t);
    }
  }
  const aw=getAyahWeakness(verse);
  const ak=ayahKey(verse);
  if(aw && aw.score>0 && aw.lastIncidentSessionId!==activeSession.id && !hasAyahIncidentThisSession(verse)){
    activeSession.cleanAyahCandidates[ak]={surah:SURAH.number,verse,page:ts[0]?.page||currentNavPage,juz:ts[0]?.juz||juzFromPage(currentNavPage),hizb:ts[0]?.hizb||hizbFallback(currentNavPage)};
  }
  activeSession.currentCleanWords=0; // ayah reveal لا يسمح بحساب streak كلمة-بكلمة بثقة
  scheduleRecitationSave();
}
function maybeCleanAyahOnCompletion(t){
  if(!t||ayahEnds[t.verse]===undefined) return;
  if(Number(t.hideIndex)+1<Number(ayahEnds[t.verse])) return;
  const aw=getAyahWeakness(t.verse);
  const ak=ayahKey(t.verse);
  if(aw && aw.score>0 && aw.lastIncidentSessionId!==activeSession.id && !hasAyahIncidentThisSession(t.verse)){
    activeSession.cleanAyahCandidates[ak]={surah:SURAH.number,verse:t.verse,page:t.page,juz:t.juz||juzFromPage(t.page),hizb:t.hizb||hizbFallback(t.page)};
  }
}

function revertWeaknessEvent(ev){
  if(!ev) return;
  if(ev.kind==="wordAssist"||ev.kind==="manualError"){
    const w=recitationData.words[ev.key];
    if(w){
      w.score=Math.max(0,(Number(w.score)||0)-1);
      if(ev.kind==="wordAssist") w.totalWordAssists=Math.max(0,(Number(w.totalWordAssists)||0)-1);
      if(ev.kind==="manualError") w.totalManualErrors=Math.max(0,(Number(w.totalManualErrors)||0)-1);
      if(ev.relapse) w.relapses=Math.max(0,(Number(w.relapses)||0)-1);
      if((w.totalWordAssists||0)+(w.totalManualErrors||0)===0 && (w.recoveries||0)===0) delete recitationData.words[ev.key];
    }
  }else if(ev.kind==="ayahAssist"){
    const w=recitationData.ayahs[ev.key];
    if(w){
      w.score=Math.max(0,(Number(w.score)||0)-1);
      w.totalAyahAssists=Math.max(0,(Number(w.totalAyahAssists)||0)-1);
      if(ev.relapse) w.relapses=Math.max(0,(Number(w.relapses)||0)-1);
      if((w.totalAyahAssists||0)===0 && (w.recoveries||0)===0) delete recitationData.ayahs[ev.key];
    }
  }
}
function undoLastRecitationEvent(){
  if(!recitationMode||!activeSession||!activeSession.events.length){
    showRecitationToast("لا يوجد تسجيل للتراجع عنه");
    return;
  }
  const ev=activeSession.events.pop();
  revertWeaknessEvent(ev);
  if(ev.kind==="wordAssist"){
    delete activeSession.passedWordKeys?.[ev.key];
  }else if(ev.kind==="ayahAssist"){
    delete activeSession.passedAyahKeys?.[ev.key];
    if(Number(ev.meta?.surah)===SURAH.number){
      tokensOfAyah(ev.meta?.verse).forEach(t=>delete activeSession.passedWordKeys?.[wordKey(t)]);
    }
  }

  const shouldRestoreReveal =
    (ev.kind==="wordAssist" || ev.kind==="ayahAssist") &&
    ev.after &&
    Number(ev.after.surah)===SURAH.number &&
    Number(ev.after.visibleCount)===visibleCount;

  if(shouldRestoreReveal){
    restoreReaderPosition(ev.before);
  }
  saveRecitationData(); updateWeaknessHighlights(); updateSessionControls();
  showRecitationToast("تم التراجع عن آخر تسجيل");
}

function applySessionHealing(session){
  const healed=[];
  for(const [key,meta] of Object.entries(session.cleanWordCandidates||{})){
    if(session.events.some(e=>(e.kind==="wordAssist"||e.kind==="manualError")&&e.key===key)) continue;
    const w=recitationData.words[key];
    if(!w||w.score<=0||w.lastIncidentSessionId===session.id) continue;
    w.score=Math.max(0,w.score-1);
    w.recoveries=(Number(w.recoveries)||0)+1;
    w.lastRecoveryAt=Date.now();
    healed.push({kind:"word",key,meta});
  }
  for(const [key,meta] of Object.entries(session.cleanAyahCandidates||{})){
    if(session.events.some(e=>e.kind==="ayahAssist"&&e.key===key)) continue;
    const w=recitationData.ayahs[key];
    if(!w||w.score<=0||w.lastIncidentSessionId===session.id) continue;
    w.score=Math.max(0,w.score-1);
    w.recoveries=(Number(w.recoveries)||0)+1;
    w.lastRecoveryAt=Date.now();
    healed.push({kind:"ayah",key,meta});
  }
  session.healed=healed;
  return healed;
}

function sessionCounts(session){
  const events=session?.events||[];
  const wordAssists=events.filter(e=>e.kind==="wordAssist").length;
  const ayahAssists=events.filter(e=>e.kind==="ayahAssist").length;
  const manualErrors=events.filter(e=>e.kind==="manualError").length;
  return {
    wordAssists,ayahAssists,manualErrors,
    totalAssists:wordAssists+ayahAssists,
    repeated:events.filter(e=>e.repeated).length
  };
}
function metricBucket(map,key){
  if(!map[key]) map[key]=defaultMetric();
  return map[key];
}
function addEventToMetric(bucket,ev){
  if(ev.kind==="wordAssist") bucket.wordAssists++;
  if(ev.kind==="ayahAssist") bucket.ayahAssists++;
  if(ev.kind==="manualError") bucket.manualErrors++;
  if(ev.repeated) bucket.repeated++;
}
function addHealingToMetric(bucket){bucket.healed++}

function commitSessionAggregates(session,summary){
  const a=recitationData.aggregate;
  const c=sessionCounts(session);
  a.totalSessions++;
  a.wordAssists+=c.wordAssists;
  a.ayahAssists+=c.ayahAssists;
  a.manualErrors+=c.manualErrors;
  a.repeated+=c.repeated;
  a.healed+=summary.healedCount;

  for(const [page,meta] of Object.entries(session.pageMeta||{})){
    a.pagesReviewed++;
    const pb=metricBucket(a.byPage,page); pb.visits++;
  }
  for(const [j,pages] of Object.entries(session.coverageJuz||{})){
    metricBucket(a.byJuz,j).pagesReviewed+=Object.keys(pages||{}).length;
  }
  for(const [hz,pages] of Object.entries(session.coverageHizb||{})){
    metricBucket(a.byHizb,hz).pagesReviewed+=Object.keys(pages||{}).length;
  }

  for(const ev of session.events||[]){
    const m=ev.meta||{};
    const page=String(m.page||0),juz=String(m.juz||juzFromPage(m.page||1)),hizb=String(m.hizb||hizbFallback(m.page||1));
    addEventToMetric(metricBucket(a.byPage,page),ev);
    addEventToMetric(metricBucket(a.byJuz,juz),ev);
    addEventToMetric(metricBucket(a.byHizb,hizb),ev);
  }
  for(const x of session.healed||[]){
    const m=x.meta||{};
    addHealingToMetric(metricBucket(a.byPage,String(m.page||0)));
    addHealingToMetric(metricBucket(a.byJuz,String(m.juz||juzFromPage(m.page||1))));
    addHealingToMetric(metricBucket(a.byHizb,String(m.hizb||hizbFallback(m.page||1))));
  }
}
function updateKhatmah(session,summary){
  const k=recitationData.khatmah;
  const cur=k.current||defaultRecitationData().khatmah.current;
  if(!cur.startedAt) cur.startedAt=session.startedAt;
  for(const p of Object.keys(session.pages||{})) cur.pages[p]=1;
  cur.wordAssists+=summary.wordAssists;
  cur.ayahAssists+=summary.ayahAssists;
  cur.manualErrors+=summary.manualErrors;
  cur.repeated+=summary.repeated;
  cur.healed+=summary.healedCount;
  if(Object.keys(cur.pages).length>=604){
    const totalAssists=cur.wordAssists+cur.ayahAssists;
    k.completed.push({
      number:cur.number,
      startedAt:cur.startedAt,
      endedAt:summary.endedAt,
      wordAssists:cur.wordAssists,
      ayahAssists:cur.ayahAssists,
      manualErrors:cur.manualErrors,
      repeated:cur.repeated,
      healed:cur.healed,
      totalAssists,
      assistsPerJuz:totalAssists/30
    });
    k.current={number:cur.number+1,startedAt:null,pages:{},wordAssists:0,ayahAssists:0,manualErrors:0,repeated:0,healed:0};
  }else{
    k.current=cur;
  }
}
function endRecitationSession(){
  if(!activeSession){
    recitationMode=false;
    applyRecitationModeUI();
    return;
  }
  const session=activeSession;
  session.endedAt=Date.now();
  session.end=tokenMeta(currentBoundaryToken())||{surah:SURAH.number,verse:1,page:currentNavPage};
  applySessionHealing(session);
  const c=sessionCounts(session);
  const pageCount=Object.keys(session.pages||{}).length;
  const summary={
    id:session.id,
    startedAt:session.startedAt,
    endedAt:session.endedAt,
    durationMs:session.endedAt-session.startedAt,
    start:session.start,
    end:session.end,
    pages:Object.keys(session.pages||{}).map(Number).sort((a,b)=>a-b),
    pageCount,
    wordAssists:c.wordAssists,
    ayahAssists:c.ayahAssists,
    manualErrors:c.manualErrors,
    totalAssists:c.totalAssists,
    repeated:c.repeated,
    healedCount:(session.healed||[]).length,
    longestCleanWords:Number(session.longestCleanWords)||0,
    assistsPerPage:pageCount?c.totalAssists/pageCount:0,
    byJuz:sessionAssistMap(session,"juz"),
    events:archiveSessionEvents(session.events)
  };
  commitSessionAggregates(session,summary);
  updateKhatmah(session,summary);
  recitationData.sessions.push(summary);
  activeSession=null;
  recitationData.activeSession=null;
  recitationMode=false;
  saveRecitationData();
  applyRecitationModeUI();
  updateWeaknessHighlights();
  showSessionSummary(summary);
}

function archiveEvent(ev){
  if(!ev) return null;
  return {
    id:ev.id,
    kind:ev.kind,
    key:ev.key,
    at:ev.at,
    meta:ev.meta,
    ayahTextKey:ev.ayahTextKey||ayahSnapshotKey(ev.meta?.surah,ev.meta?.verse),
    repeated:!!ev.repeated,
    relapse:!!ev.relapse
  };
}
function archiveSessionEvents(events){
  return (events||[]).map(archiveEvent).filter(Boolean);
}

function sessionAssistMap(session,field){
  const out={};
  for(const ev of session.events||[]){
    if(ev.kind!=="wordAssist"&&ev.kind!=="ayahAssist") continue;
    const k=String(ev.meta?.[field]||0);
    if(k!=="0") out[k]=(out[k]||0)+1;
  }
  return out;
}

let pendingRecitationExitReason=null;

function closeRecitationConfirm(){
  pendingRecitationExitReason=null;
  const overlay=document.getElementById("recitationConfirmOverlay");
  if(overlay) overlay.hidden=true;
}

function requestRecitationExit(reason="end"){
  if(!activeSession){
    recitationMode=false;
    applyRecitationModeUI();
    return;
  }

  pendingRecitationExitReason=reason;

  const overlay=document.getElementById("recitationConfirmOverlay");
  const title=document.getElementById("recitationConfirmTitle");
  const text=document.getElementById("recitationConfirmText");
  const ok=document.getElementById("recitationConfirmOk");

  if(reason==="normal"){
    if(title) title.textContent="العودة إلى الوضع العادي؟";
    if(text) text.textContent="الرجوع إلى الوضع العادي سينهي جلسة التسميع الحالية ويحفظ إحصاءاتها أولا.";
    if(ok) ok.textContent="إنهاء والعودة للعادي";
  }else{
    if(title) title.textContent="إنهاء جلسة التسميع؟";
    if(text) text.textContent="سيتم حفظ الجلسة الحالية وإحصاءاتها ثم عرض ملخصها.";
    if(ok) ok.textContent="إنهاء الجلسة";
  }

  if(overlay) overlay.hidden=false;
}

function confirmRecitationExit(){
  if(!pendingRecitationExitReason) return;
  closeRecitationConfirm();
  endRecitationSession();
}

function setRecitationMode(on){
  if(on){
    startRecitationSession();
    return;
  }
  if(activeSession){
    requestRecitationExit("normal");
    return;
  }
  recitationMode=false;
  applyRecitationModeUI();
}
function applyRecitationModeUI(){
  document.body.classList.toggle("recitation-mode",!!recitationMode);
  const controls=document.querySelector(".controls");
  controls?.classList.toggle("recitation-active",!!recitationMode);
  const row=document.getElementById("recitationControls");
  if(row) row.hidden=!recitationMode;
  document.getElementById("normalModeBtn")?.classList.toggle("active",!recitationMode);
  document.getElementById("recitationModeBtn")?.classList.toggle("active",!!recitationMode);
  updateSessionControls();
  updateControlsPositionByPage();
  applyCurrentSessionAyahAssistMarks();
}
function updateSessionControls(){
  const c=sessionCounts(activeSession);
  const w=document.getElementById("wordAssistCount"); if(w) w.textContent=c.wordAssists;
  const a=document.getElementById("ayahAssistCount"); if(a) a.textContent=c.ayahAssists;
  const m=document.getElementById("manualErrorCount"); if(m) m.textContent=c.manualErrors;
}
function normalizeWordTextForIdentity(s){
  return String(s||"").replace(/\s+/g," ").trim();
}

function resolveCurrentTokenFromMeta(meta){
  if(!meta || Number(meta.surah)!==Number(SURAH.number)) return null;

  const verse=Number(meta.verse)||0;
  if(!verse) return null;

  const tokens=tokensOfAyah(verse);
  if(!tokens.length) return null;

  const pos=Number(meta.position)||0;
  if(pos>0){
    const byPos=tokens.find(t=>Number(t.position)===pos);
    if(byPos) return byPos;
  }

  const wanted=normalizeWordTextForIdentity(meta.text);
  if(wanted){
    const matches=tokens.filter(t=>
      normalizeWordTextForIdentity(t.text_uthmani||t.text_qpc_hafs)===wanted
    );
    if(matches.length===1) return matches[0];
  }

  return null;
}

function mergeWeaknessWordRecord(target,source,newKey,newMeta){
  if(!target){
    return {
      ...source,
      key:newKey,
      meta:newMeta
    };
  }

  const sourceLast=Number(source.lastAt)||0;
  const targetLast=Number(target.lastAt)||0;

  return {
    ...target,
    key:newKey,
    meta:newMeta,
    score:(Number(target.score)||0)+(Number(source.score)||0),
    totalWordAssists:(Number(target.totalWordAssists)||0)+(Number(source.totalWordAssists)||0),
    totalManualErrors:(Number(target.totalManualErrors)||0)+(Number(source.totalManualErrors)||0),
    recoveries:(Number(target.recoveries)||0)+(Number(source.recoveries)||0),
    relapses:(Number(target.relapses)||0)+(Number(source.relapses)||0),
    lastAt:Math.max(targetLast,sourceLast)||null,
    lastIncidentSessionId:
      sourceLast>=targetLast
        ? (source.lastIncidentSessionId||target.lastIncidentSessionId||null)
        : (target.lastIncidentSessionId||source.lastIncidentSessionId||null),
    lastRecoveryAt:Math.max(Number(target.lastRecoveryAt)||0,Number(source.lastRecoveryAt)||0)||null
  };
}

function migrateLegacyWordIdentityForCurrentSurah(){
  let changed=false;
  const prefix=`${SURAH.number}:`;

  // 1) Weakness records.
  for(const [oldKey,record] of Object.entries({...recitationData.words})){
    if(!oldKey.startsWith(prefix)) continue;

    const token=resolveCurrentTokenFromMeta(record?.meta);
    if(!token) continue;

    const newKey=wordKey(token);
    const newMeta=tokenMeta(token);

    if(oldKey===newKey){
      if(Number(record?.meta?.position)!==Number(newMeta.position)){
        record.meta=newMeta;
        changed=true;
      }
      continue;
    }

    recitationData.words[newKey]=mergeWeaknessWordRecord(
      recitationData.words[newKey],
      record,
      newKey,
      newMeta
    );
    delete recitationData.words[oldKey];
    changed=true;
  }

  // 2) Event histories: repair key + metadata when the target word is resolvable.
  const migrateEvent=(ev)=>{
    if(!ev || !["wordAssist","manualError"].includes(ev.kind)) return;
    if(Number(ev.meta?.surah)!==Number(SURAH.number)) return;

    const token=resolveCurrentTokenFromMeta(ev.meta);
    if(!token) return;

    const newKey=wordKey(token);
    if(ev.key!==newKey || Number(ev.meta?.position)!==Number(token.position)){
      ev.key=newKey;
      ev.meta=tokenMeta(token);
      changed=true;
    }
  };

  (recitationData.sessions||[]).forEach(s=>(s.events||[]).forEach(migrateEvent));
  (activeSession?.events||[]).forEach(migrateEvent);

  // 3) Clean candidates in an active session.
  if(activeSession?.cleanWordCandidates){
    const rebuilt={};
    for(const meta of Object.values(activeSession.cleanWordCandidates)){
      const token=resolveCurrentTokenFromMeta(meta);
      if(token) rebuilt[wordKey(token)]=tokenMeta(token);
    }
    activeSession.cleanWordCandidates=rebuilt;
  }

  // 4) Repair the active-session starting word if an old :0 identity was stored.
  if(activeSession?.start && Number(activeSession.start.surah)===Number(SURAH.number)){
    const startToken=resolveCurrentTokenFromMeta(activeSession.start);
    if(startToken){
      const newStart=tokenMeta(startToken);
      if(Number(activeSession.start.position)!==Number(newStart.position)){
        activeSession.start=newStart;
        changed=true;
      }
    }
  }

  // 5) Rebuild passed-word identities conservatively from what is already
  // visibly traversed in the current session. This prevents old :0 keys from
  // affecting "سبق المرور" logic after an update.
  if(activeSession){
    const rebuiltPassed={};
    for(const key of Object.keys(activeSession.passedWordKeys||{})){
      if(!key.startsWith(prefix) || !key.endsWith(":0")) rebuiltPassed[key]=1;
    }

    for(const ev of activeSession.events||[]){
      if(["wordAssist","manualError"].includes(ev.kind) &&
         Number(ev.meta?.surah)===Number(SURAH.number)){
        const token=resolveCurrentTokenFromMeta(ev.meta);
        if(token) rebuiltPassed[wordKey(token)]=1;
      }
    }

    activeSession.passedWordKeys=rebuiltPassed;
  }

  // 6) Current-surah ayah snapshots are safe to rebuild from the loaded mushaf
  // so word highlighting inside the full ayah uses the repaired positions.
  for(const key of Object.keys(recitationData.ayahText||{})){
    if(!key.startsWith(prefix)) continue;
    const verse=Number(key.split(":")[1])||0;
    const snap=verse ? buildCurrentAyahSnapshot(verse) : null;
    if(snap){
      recitationData.ayahText[key]=snap;
      changed=true;
    }
  }

  recitationData.version=3;
  if(changed) saveRecitationData();
  return changed;
}

function initRecitationAfterRender(){
  migrateLegacyWordIdentityForCurrentSurah();
  document.body.classList.toggle("show-weakness",weaknessMarksEnabled);
  if(activeSession){
    activeSession.pages=activeSession.pages||{};
    activeSession.pageMeta=activeSession.pageMeta||{};
    activeSession.coverageJuz=activeSession.coverageJuz||{};
    activeSession.coverageHizb=activeSession.coverageHizb||{};
    activeSession.events=activeSession.events||[];
    activeSession.passedWordKeys=activeSession.passedWordKeys||{};
    activeSession.passedAyahKeys=activeSession.passedAyahKeys||{};
    activeSession.cleanWordCandidates=activeSession.cleanWordCandidates||{};
    activeSession.cleanAyahCandidates=activeSession.cleanAyahCandidates||{};
    recitationMode=true;
    trackSessionToken(currentBoundaryToken());
  }
  applyRecitationModeUI();
  updateWeaknessHighlights();
  backfillCurrentSurahAyahSnapshots();
}

function historicalEventsForCurrentView(){
  if(weaknessReplayMode==="current") return [];

  if(weaknessReplayMode==="active"){
    return (activeSession?.events||[]).filter(
      e=>Number(e.meta?.surah)===Number(SURAH.number)
    );
  }

  if(weaknessReplayMode==="session"){
    const s=(recitationData.sessions||[]).find(
      x=>String(x.id)===String(weaknessReplaySessionId)
    );
    return (s?.events||[]).filter(
      e=>Number(e.meta?.surah)===Number(SURAH.number)
    );
  }

  if(weaknessReplayMode==="all"){
    const events=[];
    for(const s of recitationData.sessions||[]){
      for(const e of s.events||[]){
        if(Number(e.meta?.surah)===Number(SURAH.number)) events.push(e);
      }
    }
    return events;
  }

  return [];
}

function historicalWeaknessMaps(events){
  const words={};
  const ayahs={};

  for(const ev of events||[]){
    if(!ev?.meta || Number(ev.meta.surah)!==Number(SURAH.number)) continue;

    if(ev.kind==="wordAssist" || ev.kind==="manualError"){
      /*
        لا نعتمد على key القديم وحده؛ نحاول ربط metadata بالكلمة الحالية
        حتى تعمل سجلات الإصدارات الأقدم بعد إصلاح هوية الكلمات.
      */
      const t=resolveCurrentTokenFromMeta(ev.meta);
      const key=t ? wordKey(t) : String(ev.key||"");
      if(key) words[key]=(words[key]||0)+1;
    }

    if(ev.kind==="ayahAssist"){
      const verse=Number(ev.meta.verse)||0;
      if(verse){
        const key=ayahKey(verse,Number(ev.meta.surah)||SURAH.number);
        ayahs[key]=(ayahs[key]||0)+1;
      }
    }
  }

  return {words,ayahs};
}

function historyLevel(count){
  count=Number(count)||0;
  return count>=3 ? 3 : count===2 ? 2 : count===1 ? 1 : 0;
}

function sessionTouchesCurrentSurah(session){
  return (session?.events||[]).some(
    e=>Number(e.meta?.surah)===Number(SURAH.number)
  );
}

function historicalSessionOptions(){
  const rows=[];

  if(activeSession && (activeSession.events||[]).some(
    e=>Number(e.meta?.surah)===Number(SURAH.number)
  )){
    rows.push({
      value:"active",
      label:`الجلسة الجارية — ${fmtDate(activeSession.startedAt)}`
    });
  }

  const historical=[...(recitationData.sessions||[])]
    .filter(sessionTouchesCurrentSurah)
    .reverse();

  historical.forEach((s,index)=>{
    rows.push({
      value:`session:${s.id}`,
      label:`جلسة ${fmtDate(s.startedAt)} — ${summaryRange(s)} — Assist ${fmtNumber(s.totalAssists||0)}`
    });
  });

  return rows;
}

function currentReplaySelectValue(){
  if(weaknessReplayMode==="current") return "current";
  if(weaknessReplayMode==="all") return "all";
  if(weaknessReplayMode==="active") return "active";
  if(weaknessReplayMode==="session") return `session:${weaknessReplaySessionId}`;
  return "current";
}

function replaySourceFromValue(value){
  value=String(value||"current");

  if(value==="all"){
    return {mode:"all",id:null,label:"كل الجلسات"};
  }
  if(value==="active"){
    return {mode:"active",id:null,label:"الجلسة الجارية"};
  }
  if(value.startsWith("session:")){
    const id=value.slice("session:".length);
    const s=(recitationData.sessions||[]).find(x=>String(x.id)===id);
    return {
      mode:"session",
      id,
      label:s ? `جلسة ${fmtDate(s.startedAt)} — ${summaryRange(s)}` : "جلسة محددة"
    };
  }

  return {mode:"current",id:null,label:"الحالة الحالية"};
}

function setWeaknessReplay(value,{closeStatsAfter=false,toast=true}={}){
  const source=replaySourceFromValue(value);

  weaknessReplayMode=source.mode;
  weaknessReplaySessionId=source.id;
  weaknessReplayLabel=source.label;

  updateWeaknessHighlights();

  const statsBtn=document.getElementById("statsOpen");
  if(statsBtn){
    statsBtn.classList.toggle("history-active",weaknessReplayMode!=="current");
    statsBtn.title=weaknessReplayMode==="current"
      ? "إحصاءات التسميع"
      : `عرض تاريخي: ${weaknessReplayLabel}`;
  }

  if(toast){
    showRecitationToast(
      weaknessReplayMode==="current"
        ? "عادت السورة إلى علامات الضعف الحالية"
        : `أعيد تشكيل السورة: ${weaknessReplayLabel}`
    );
  }

  if(closeStatsAfter) closeStats();
}

function historyRebuildControlsHtml(){
  const options=[
    `<option value="current">الحالة الحالية — Weakness Score بعد الشفاء</option>`,
    `<option value="all">كل الجلسات المحفوظة</option>`
  ];

  for(const row of historicalSessionOptions()){
    options.push(
      `<option value="${escapeHtml(row.value)}">${escapeHtml(row.label)}</option>`
    );
  }

  return `
    <div class="history-rebuild-box">
      <div class="history-rebuild-title">إعادة تشكيل السورة من سجل التسميع</div>
      <div class="history-rebuild-row">
        <select id="historyReplaySelect" aria-label="مصدر إعادة تشكيل السورة">
          ${options.join("")}
        </select>
        <button id="historyReplayApply" type="button">تطبيق على السورة</button>
        <button id="historyReplayCurrent" type="button">الحالة الحالية</button>
      </div>
      <div class="history-rebuild-note">
        جلسة محددة: تعرض فقط مواضع المساعدة والخطأ في تلك الجلسة.
        كل الجلسات: تجمع تاريخ السورة كله، وتزداد شدة العلامة مع تكرر الحدث.
        هذا عرض بصري فقط ولا يغيّر الدرجات أو الشفاء أو الإحصاءات.
      </div>
    </div>
  `;
}

function bindHistoryRebuildControls(){
  const select=document.getElementById("historyReplaySelect");
  if(select) select.value=currentReplaySelectValue();

  document.getElementById("historyReplayApply")?.addEventListener("click",()=>{
    setWeaknessReplay(select?.value||"current",{closeStatsAfter:true});
  });

  document.getElementById("historyReplayCurrent")?.addEventListener("click",()=>{
    setWeaknessReplay("current",{closeStatsAfter:true});
  });
}

function updateWeaknessHighlights(){
  const historical=weaknessReplayMode!=="current";

  document.body.classList.toggle("show-weakness",weaknessMarksEnabled && !historical);
  document.body.classList.toggle("history-replay",historical);

  // امسح طبقتي العرض قبل إعادة الرسم.
  document.querySelectorAll(".word").forEach(el=>{
    el.classList.remove(
      "weak-1","weak-2","weak-3",
      "history-weak-1","history-weak-2","history-weak-3"
    );
  });
  document.querySelectorAll(".verse-end").forEach(el=>{
    el.classList.remove(
      "ayah-weak-1","ayah-weak-2","ayah-weak-3",
      "history-ayah-1","history-ayah-2","history-ayah-3"
    );
  });

  if(historical){
    const maps=historicalWeaknessMaps(historicalEventsForCurrentView());

    document.querySelectorAll(".word").forEach(el=>{
      const level=historyLevel(maps.words[el.dataset.wordKey||""]);
      if(level) el.classList.add(`history-weak-${level}`);
    });

    document.querySelectorAll(".verse-end").forEach(el=>{
      const level=historyLevel(maps.ayahs[el.dataset.ayahKey||""]);
      if(level) el.classList.add(`history-ayah-${level}`);
    });

    // لا نخلط حلقة Ayah Assist الجارية مع إعادة تشكيل جلسة تاريخية.
    document.querySelectorAll(".verse-end.session-ayah-assist")
      .forEach(el=>el.classList.remove("session-ayah-assist"));
  }else{
    document.querySelectorAll(".word").forEach(el=>{
      const w=recitationData.words[el.dataset.wordKey||""];
      const score=Number(w?.score)||0;
      if(score>0) el.classList.add(score>=3?"weak-3":score===2?"weak-2":"weak-1");
    });

    document.querySelectorAll(".verse-end").forEach(el=>{
      const a=recitationData.ayahs[el.dataset.ayahKey||""];
      const score=Number(a?.score)||0;
      if(score>0) el.classList.add(score>=3?"ayah-weak-3":score===2?"ayah-weak-2":"ayah-weak-1");
    });

    applyCurrentSessionAyahAssistMarks();
  }
}
function toggleWeaknessMarks(){
  weaknessMarksEnabled=!weaknessMarksEnabled;
  localStorage.setItem(WEAKNESS_MARKS_KEY,weaknessMarksEnabled?"1":"0");
  updateWeaknessHighlights();
  renderStats();
}

function showRecitationToast(text){
  const el=document.getElementById("recitationToast");
  if(!el) return;
  el.textContent=text; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),1500);
}
function fmtNumber(n,digits=0){
  const x=Number(n)||0;
  return x.toLocaleString("ar-EG",{maximumFractionDigits:digits,minimumFractionDigits:digits});
}
function fmtDuration(ms){
  const min=Math.max(0,Math.round((Number(ms)||0)/60000));
  if(min<60) return `${min} د`;
  const h=Math.floor(min/60),m=min%60;
  return `${h} س ${m} د`;
}
function fmtDate(ts){
  try{return new Date(ts).toLocaleString("ar-EG",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}
}
function surahName(n){
  try{return getSurahConfig(Number(n))?.name||`سورة ${n}`;}catch(e){return `سورة ${n}`;}
}
function summaryRange(s){
  const a=s.start||{},b=s.end||{};
  if(a.surah===b.surah) return `${surahName(a.surah)}: ${a.verse||1}–${b.verse||1}`;
  return `${surahName(a.surah)} ${a.verse||1} ← ${surahName(b.surah)} ${b.verse||1}`;
}

function eventKindLabel(kind){
  if(kind==="wordAssist") return "مساعدة كلمة";
  if(kind==="ayahAssist") return "مساعدة آية";
  if(kind==="manualError") return "خطأ يدوي";
  return kind||"حدث";
}
function renderAyahSnapshot(snapshot,targetPosition=null){
  if(!snapshot) return '<span style="opacity:.6">نص الآية غير متاح في السجل القديم.</span>';

  const words=Array.isArray(snapshot.words)?snapshot.words:[];

  if(words.length){
    return words.map(w=>{
      const text=escapeHtml(w.text||"");
      if(targetPosition!==null && Number(w.position)===Number(targetPosition)){
        return `<span class="event-target">${text}</span>`;
      }
      return text;
    }).join(" ");
  }

  return escapeHtml(snapshot.text||"");
}
function eventDetailHtml(ev){
  const m=ev?.meta||{};
  const snap=getAyahSnapshot(m.surah,m.verse);
  const target=(ev.kind==="ayahAssist") ? null : (Number(m.position)||null);
  const wordText=(ev.kind==="ayahAssist") ? "" : (m.text||"");
  const badges=[
    ev.repeated ? '<span class="event-badge">متكرر</span>' : "",
    ev.relapse ? '<span class="event-badge">عاد بعد تحسن</span>' : ""
  ].filter(Boolean).join("");

  return `
    <div class="event-card">
      <div class="event-head">
        <div>
          <b>${eventKindLabel(ev.kind)}</b>
          — ${escapeHtml(surahName(m.surah))}، الآية ${fmtNumber(m.verse)}
          ${wordText?` — الكلمة: <b>${escapeHtml(wordText)}</b>`:""}
        </div>
        <div class="event-meta">${fmtDate(ev.at)}</div>
      </div>
      <div class="event-ayah">${renderAyahSnapshot(snap,target)}</div>
      ${badges?`<div class="event-badges">${badges}</div>`:""}
    </div>
  `;
}
function eventDetailList(events,emptyText="لا توجد أخطاء أو مساعدات في هذه الجلسة."){
  const arr=(events||[]).filter(e=>e && ["wordAssist","ayahAssist","manualError"].includes(e.kind));
  if(!arr.length) return `<div style="font-size:12px;opacity:.65;margin-top:6px">${emptyText}</div>`;
  return `<div class="event-list">${arr.map(eventDetailHtml).join("")}</div>`;
}
function allEventHistoryRows(limit=300){
  const rows=[];

  for(const s of recitationData.sessions||[]){
    for(const e of s.events||[]){
      rows.push({...e,sessionStartedAt:s.startedAt});
    }
  }

  if(activeSession){
    for(const e of activeSession.events||[]){
      rows.push({...archiveEvent(e),sessionStartedAt:activeSession.startedAt});
    }
  }

  rows.sort((a,b)=>(Number(b.at)||0)-(Number(a.at)||0));
  const shown=rows.slice(0,limit);

  if(!shown.length){
    return '<div style="font-size:12px;opacity:.65;margin-top:6px">لا توجد أخطاء أو مساعدات مسجلة بعد.</div>';
  }

  const note=rows.length>limit
    ? `<div style="font-size:10px;opacity:.6;margin-top:6px">يعرض أحدث ${fmtNumber(limit)} حدثا من أصل ${fmtNumber(rows.length)}.</div>`
    : "";

  return eventDetailList(shown)+note;
}

      <div class="summary-item"><span>Ayah Assist</span><b>${fmtNumber(s.ayahAssists)}</b></div>
      <div class="summary-item"><span>Total Assists</span><b>${fmtNumber(s.totalAssists)}</b></div>
      <div class="summary-item"><span>أخطاء يدوية</span><b>${fmtNumber(s.manualErrors)}</b></div>
      <div class="summary-item"><span>مواضع ضعف اجتازها</span><b>${fmtNumber(s.healedCount)}</b></div>
      <div class="summary-item"><span>Assist / Page</span><b>${fmtNumber(s.assistsPerPage,2)}</b></div>
      <div class="summary-item"><span>أخطاء متكررة</span><b>${fmtNumber(s.repeated)}</b></div>
    </div>
    <div style="font-size:12px;line-height:1.7"><b>الصفحات:</b> ${s.pages?.length ? (s.pages.length===1 ? s.pages[0] : `${s.pages[0]}–${s.pages[s.pages.length-1]}`) : "—"}</div>
    <div style="font-size:12px;line-height:1.7"><b>Assists حسب الجزء:</b> ${juzText}</div>

  ov.hidden=false;
}
function closeSessionSummary(){document.getElementById("sessionSummaryOverlay").hidden=true}

function metricAssist(m){return (Number(m?.wordAssists)||0)+(Number(m?.ayahAssists)||0)}
function metricRows(map,labelFn,rateDenom="visits"){
  return Object.entries(map||{}).sort((a,b)=>Number(a[0])-Number(b[0])).map(([k,m])=>{
    const denom=Number(m?.[rateDenom])||0;
    return `<tr><td>${labelFn(k)}</td><td>${fmtNumber(m.wordAssists)}</td><td>${fmtNumber(m.ayahAssists)}</td><td>${fmtNumber(m.manualErrors)}</td><td>${fmtNumber(metricAssist(m))}</td><td>${denom?fmtNumber(metricAssist(m)/denom,2):"—"}</td><td>${fmtNumber(m.healed)}</td></tr>`;
  }).join("");
}
function metricTable(map,labelFn,rateDenom="visits",rateLabel="Assist/زيارة"){
  const rows=metricRows(map,labelFn,rateDenom);
  if(!rows) return `<div style="font-size:12px;opacity:.65;margin-top:6px">لا توجد بيانات بعد.</div>`;
  return `<div style="overflow:auto"><table class="stats-table"><thead><tr><th>الموضع</th><th>كلمة</th><th>آية</th><th>يدوي</th><th>Assist</th><th>${rateLabel}</th><th>تعافى</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function weakestRows(){
  const words=Object.values(recitationData.words||{})
    .filter(w=>(Number(w.score)||0)>0)
    .sort((a,b)=>(b.score-a.score)-0 || ((b.totalWordAssists+b.totalManualErrors)-(a.totalWordAssists+a.totalManualErrors)))
    .slice(0,40);

  const ayahs=Object.values(recitationData.ayahs||{})
    .filter(w=>(Number(w.score)||0)>0)
    .sort((a,b)=>b.score-a.score || b.totalAyahAssists-a.totalAyahAssists)
    .slice(0,20);

  let html='<div class="weak-list">';

  for(const w of words){
    const m=w.meta||{};
    const snap=getAyahSnapshot(m.surah,m.verse);

    html+=`
      <div class="weak-row-rich">
        <div class="weak-topline">
          <div>
            <span class="word-text">${escapeHtml(m.text||"")}</span>
            · ${escapeHtml(surahName(m.surah))}، الآية ${fmtNumber(m.verse)}
          </div>
          <b>ضعف ${fmtNumber(w.score)}</b>
        </div>
        <div style="font-size:10px;opacity:.7;margin-bottom:3px">
          Word Assist ${fmtNumber(w.totalWordAssists)} · خطأ يدوي ${fmtNumber(w.totalManualErrors)}
        </div>
        <div class="event-ayah">${renderAyahSnapshot(snap,Number(m.position)||null)}</div>
      </div>`;
  }

  for(const a of ayahs){
    const m=a.meta||{};
    const snap=getAyahSnapshot(m.surah,m.verse);

    html+=`
      <div class="weak-row-rich">
        <div class="weak-topline">
          <div>${escapeHtml(surahName(m.surah))}، الآية ${fmtNumber(m.verse)}</div>
          <b>ضعف ${fmtNumber(a.score)}</b>
        </div>
        <div style="font-size:10px;opacity:.7;margin-bottom:3px">
          Ayah Assist ${fmtNumber(a.totalAyahAssists)}
        </div>
        <div class="event-ayah">${renderAyahSnapshot(snap,null)}</div>
      </div>`;
  }

  html+='</div>';

  return words.length||ayahs.length
    ? html
    : '<div style="font-size:12px;opacity:.65;margin-top:6px">لا توجد مواضع ضعف حالية.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sessionHistoryRows(){
  const arr=[...(recitationData.sessions||[])].reverse().slice(0,60);

  if(!arr.length){
    return '<div style="font-size:12px;opacity:.65;margin-top:6px">لا توجد جلسات منتهية بعد.</div>';
  }

  return arr.map(s=>`
    <details class="session-row">
      <summary>
        <b>${fmtDate(s.startedAt)}</b> · ${summaryRange(s)}
        — ${fmtNumber(s.pageCount)} صفحة · ${fmtDuration(s.durationMs)}
        · Assist ${fmtNumber(s.totalAssists)} · يدوي ${fmtNumber(s.manualErrors)}
      </summary>
      ${Array.isArray(s.events)
        ? `
          <div style="margin-top:6px">
            <button type="button" class="history-session-show" data-session-id="${escapeHtml(s.id)}">عرض هذه الجلسة على السورة</button>
          </div>
          ${eventDetailList(s.events)}
        `
        : '<div style="font-size:11px;opacity:.6;margin-top:6px">هذه جلسة من إصدار أقدم؛ لم تكن تفاصيل الأحداث تحفظ وقتها.</div>'}
    </details>
  `).join('');
}
function khatmahRows(){
  const done=recitationData.khatmah?.completed||[];
  const cur=recitationData.khatmah?.current;
  let html='';
  for(const k of done){html+=`<div class="session-row"><b>ختمة ${fmtNumber(k.number)}</b> — ${fmtNumber(k.totalAssists)} assists · ${fmtNumber(k.assistsPerJuz,2)} Assist/Juz · أخطاء يدوية ${fmtNumber(k.manualErrors)}</div>`}
  if(cur){
    const covered=Object.keys(cur.pages||{}).length,total=(cur.wordAssists||0)+(cur.ayahAssists||0);
    html+=`<div class="session-row"><b>الختمة الحالية ${fmtNumber(cur.number)}</b> — ${fmtNumber(covered)}/604 صفحة · ${fmtNumber(total)} assists</div>`;
  }
  return html||'<div style="font-size:12px;opacity:.65">لا توجد بيانات ختمات.</div>';
}
function renderStats(){
  const box=document.getElementById("statsContent"); if(!box) return;
  const a=recitationData.aggregate||defaultRecitationData().aggregate;
  const totalAssists=(a.wordAssists||0)+(a.ayahAssists||0);
  const assistPerPage=a.pagesReviewed?totalAssists/a.pagesReviewed:0;
  const juzEquiv=a.pagesReviewed?(a.pagesReviewed/604)*30:0;
  const assistPerJuz=juzEquiv?totalAssists/juzEquiv:0;
  const repeatedSpots=[...Object.values(recitationData.words||{}),...Object.values(recitationData.ayahs||{})].filter(w=>{
    const incidents=(Number(w.totalWordAssists)||0)+(Number(w.totalManualErrors)||0)+(Number(w.totalAyahAssists)||0);
    return incidents>1 || (Number(w.relapses)||0)>0;
  }).length;
  box.innerHTML=`
    <div class="stats-kpis">
      <div class="stats-kpi"><span>الجلسات</span><b>${fmtNumber(a.totalSessions)}</b></div>
      <div class="stats-kpi"><span>Total Assists</span><b>${fmtNumber(totalAssists)}</b></div>
      <div class="stats-kpi"><span>Assist/Page</span><b>${fmtNumber(assistPerPage,2)}</b></div>
      <div class="stats-kpi"><span>Assist/Juz</span><b>${fmtNumber(assistPerJuz,2)}</b></div>
      <div class="stats-kpi"><span>أخطاء يدوية</span><b>${fmtNumber(a.manualErrors)}</b></div>
      <div class="stats-kpi"><span>مواضع تعافت</span><b>${fmtNumber(a.healed)}</b></div>
      <div class="stats-kpi"><span>مواضع ضعف متكررة</span><b>${fmtNumber(repeatedSpots)}</b></div>
    </div>
    ${historyRebuildControlsHtml()}

  `;
  document.getElementById("weakMarksCheckbox")?.addEventListener("change",toggleWeaknessMarks,{once:true});

/*

  حتى لا يعيد auto-scroll ضبط المؤشر أثناء حركاته البرمجية.
*/

  if(!autoScroll) return;

  if(e.target.closest(".page")){
    touchScrolling=true;
    touchStartPage=getViewportPage() || currentNavPage || FIRST_PAGE;
  }
},{passive:true});

/*
  في كل سكرول نحدّث رقم الصفحة المعروضة.
  وإذا كان السكرول لمسيّاً يدوياً، نعيد مرجع المؤشر عند دخول صفحة جديدة.
*/
window.addEventListener("scroll",()=>{

  if(navScrollRaf) cancelAnimationFrame(navScrollRaf);
  navScrollRaf=requestAnimationFrame(()=>{
    updateDisplayedPageFromViewport();
    navScrollRaf=0;
  });

  if(touchScrolling){
    clearTimeout(scrollSyncTimer);
    scrollSyncTimer=setTimeout(()=>{
      syncCursorToVisiblePage();
    },90);
  }
},{passive:true});

  clearTimeout(scrollSyncTimer);
  scrollSyncTimer=setTimeout(()=>{
    syncCursorToVisiblePage();
    touchScrolling=false;
  },100);
},{passive:true});

document.addEventListener("touchcancel",()=>{

},{passive:true});




/* ---------------------------------
   سياسة موضع شريط التحكم
   - Auto-scroll ON: أسفل الشاشة دائما.
   - Auto-scroll OFF: أسفل الشاشة افتراضيا،
     ويصعد مؤقتا فقط في الربع الأخير من الصفحة الحالية.
---------------------------------- */

const controlsWrapFixed = document.querySelector(".controls-wrap");

function syncPositionToggle(position){
  const btn=document.getElementById("positionToggle");
  if(!btn) return;

  const top=position==="top";
  btn.textContent=top ? "⬆" : "⬇";
  btn.classList.toggle("on",top);
  btn.setAttribute("aria-pressed",top ? "true" : "false");
  btn.title=top ? "موضع الشريط: أعلى" : "موضع الشريط: أسفل";
}

function controlsToBottom(){
  if(!controlsWrapFixed) return;
  controlsWrapFixed.classList.remove("at-top");
  controlsWrapFixed.classList.add("at-bottom");
  syncPositionToggle("bottom");
}

function controlsToTop(){
  if(!controlsWrapFixed) return;
  controlsWrapFixed.classList.remove("at-bottom");
  controlsWrapFixed.classList.add("at-top");
  syncPositionToggle("top");
}


function referenceControlsPageNo(){
  if(!autoScroll) return activePage||currentNavPage||FIRST_PAGE;
  const page=currentVisiblePageElement();
  return page ? Number(String(page.id).replace("page-","")) : (currentNavPage||FIRST_PAGE);
}
function toggleControlsManualPosition(){
  const pageNo=referenceControlsPageNo();
  const isTop=controlsWrapFixed?.classList.contains("at-top");
  controlsManualPage=pageNo;
  controlsManualPosition=isTop?"bottom":"top";
  if(controlsManualPosition==="top") controlsToTop(); else controlsToBottom();
}
document.getElementById("positionToggle").onclick=toggleControlsManualPosition;

function currentVisiblePageElement(){
  const pages=[...document.querySelectorAll(".page")];
  if(!pages.length) return null;

  /*
    الصفحة المرجعية للشريط هي الصفحة التي يمر أعلى الشاشة داخلها.
    هذا يمنع الفراغ بين الصفحات وطول الشاشة من خداع الحساب.
  */
  const probeY = 1;

  let containing = null;
  let nearestBelow = null;
  let nearestBelowTop = Infinity;

  for(const page of pages){
    const r=page.getBoundingClientRect();

    if(r.top <= probeY && r.bottom > probeY){
      containing = page;
      break;
    }

    if(r.top > probeY && r.top < nearestBelowTop){
      nearestBelowTop = r.top;
      nearestBelow = page;
    }
  }

  return containing || nearestBelow || pages[pages.length-1];
}

function updateControlsPositionByPage(){
  if(!autoScroll){
    controlsFromManualCursor();
    return;
  }

  const page=currentVisiblePageElement();
  if(!page){
    controlsToBottom();
    return;
  }

  const pageNo=Number(String(page.id).replace("page-",""));

  /*
    بمجرد دخول صفحة جديدة:
    - أنزل الشريط فورا.
    - امنع الصعود لحظيا حتى تستقر الصفحة الجديدة.
  */
  if(pageNo !== controlsLastPage){
    controlsLastPage=pageNo;
    controlsPageEnteredAt=performance.now();

    /* الصفحة الجديدة تعيد الوضع اليدوي إلى التلقائي. */
    controlsManualPosition=null;
    controlsManualPage=null;

    controlsToBottom();
    return;
  }

  /*
    إذا اختار المستخدم موضعا يدويا في الصفحة الحالية،
    نحترمه حتى الانتقال إلى صفحة أخرى.
  */
  if(controlsManualPage===pageNo && controlsManualPosition){
    if(controlsManualPosition==="top") controlsToTop();
    else controlsToBottom();
    return;
  }

  /*
    نافذة استقرار قصيرة تمنع بقايا حسابات الصفحة السابقة
    من رفع الشريط مباشرة بعد الانتقال.
  */
  if(performance.now() - controlsPageEnteredAt < 80){
    controlsToBottom();
    return;
  }

  const r=page.getBoundingClientRect();
  const pageHeight=Math.max(1,r.height);

  /*
    التقدم الحقيقي داخل الصفحة = الجزء الذي مر فوق أعلى الشاشة.
    عند بداية الصفحة يكون 0، وعند مرور ثلاثة أرباعها يصبح 0.75.
    لا نستخدم أسفل الشاشة إطلاقا لأن ذلك كان يرفع الشريط مبكرا
    على الشاشات الطويلة.
  */
  const passedAboveTop=Math.max(0,-r.top);
  const progressed=passedAboveTop / pageHeight;

  if(progressed >= 0.75 && progressed < 1){
    controlsToTop();
  }else{
    controlsToBottom();
  }
}

/* الموضع الافتراضي دائما بالأسفل */
controlsToBottom();

let controlsLastPage = null;
let controlsPageEnteredAt = 0;
let controlsPositionRaf=0;
window.addEventListener("scroll",()=>{
  if(controlsPositionRaf) cancelAnimationFrame(controlsPositionRaf);
  controlsPositionRaf=requestAnimationFrame(()=>{
    updateControlsPositionByPage();
    controlsPositionRaf=0;
  });
},{passive:true});

window.addEventListener("resize",updateControlsPositionByPage);


/* Swipe يقلب الصفحة فقط عندما Auto-scroll = OFF */
const pagesStage=document.getElementById("pages");

pagesStage.addEventListener("touchstart",e=>{
  if(autoScroll || e.touches.length!==1) return;

  swipeTracking=true;
  swipeStartY=e.touches[0].clientY;
  swipeStartX=e.touches[0].clientX;
},{passive:true});

pagesStage.addEventListener("touchend",e=>{
  if(autoScroll || !swipeTracking || !e.changedTouches.length) return;

  swipeTracking=false;

  const endY=e.changedTouches[0].clientY;
  const endX=e.changedTouches[0].clientX;

  const dy=endY-swipeStartY;
  const dx=endX-swipeStartX;

  if(Math.abs(dy)<55 || Math.abs(dy)<Math.abs(dx)*1.15){
    return;
  }

  if(dy<0) nextPageManual();
  else previousPageManual();
},{passive:true});

pagesStage.addEventListener("touchcancel",()=>{
  swipeTracking=false;
},{passive:true});


// Wheel: كلمة كلمة
let wheelLock=false;
window.addEventListener("wheel",e=>{
  if(e.ctrlKey) return;
  e.preventDefault();

  if(wheelLock) return;
  wheelLock=true;

  if(e.deltaY>0) showNextWord();
  else hidePreviousWord();

  setTimeout(()=>wheelLock=false,80);
},{passive:false});

document.addEventListener("keydown",e=>{

    document.activeElement===document.getElementById("ayahInput")
  ) return;

  if(e.key==="ArrowDown" || e.key===" "){
    e.preventDefault();
    showNextWord();
  }else if(e.key==="ArrowUp"){

    hidePreviousWord();

    e.preventDefault();
    showNextAyah();
  }else if(e.key==="ArrowRight"){

  }
});
