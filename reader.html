<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece8df">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>مصحف الحفظ</title>

<style>
*{box-sizing:border-box}

@font-face{
  font-family:"UthmanicHafs";
  src:url("https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2") format("woff2");
  font-display:swap;
}

:root{
  --paper:#fbf8ef;
  --desk:#e9e5dc;
  --ink:#171717;
  --border:#cec7b8;
  --panel:rgba(251,248,239,.97);
  --button:#f2f2f2;
  --button-hover:#e6e6e6;
  --cursor-mark:#a95f00;
  --page-width:820px;
}

body.dark{
  --paper:#171717;
  --desk:#0f0f0f;
  --ink:#e8e3d8;
  --border:#3a3a3a;
  --panel:rgba(24,24,24,.97);
  --button:#262626;
  --button-hover:#303030;
  --cursor-mark:#ffbf69;
}

html{scroll-behavior:smooth}

html,body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  scrollbar-width:none;
  -ms-overflow-style:none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
  width:0;
  height:0;
  display:none;
}

body{
  margin:0;
  background:var(--desk);
  color:var(--ink);
  font-family:Tahoma,Arial,sans-serif;
}

#app{
  width:100%;
  max-width:1100px;
  margin:18px auto 150px;
  padding-inline:0;
}

h1{
  margin:0 0 8px;
  text-align:center;
  font-size:23px;
  font-weight:500;
}

#loading{
  text-align:center;
  padding:12px;
  font-size:14px;
  opacity:.75;
}

.page{
  width:100%;
  max-width:var(--page-width);
  height:1080px;
  margin:22px auto;
  padding:34px 42px 42px;
  background:var(--paper);
  border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,.09);
  position:relative;
  overflow:hidden;
}

.surah-head{
  height:62px;
  border:1px solid #a9a08e;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 30px 5px;
  font-family:"UthmanicHafs","Traditional Arabic",serif;
  font-size:31px;
}

.basmala{
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"UthmanicHafs","Traditional Arabic",serif;
  font-size:29px;
  margin-bottom:3px;
}

.page-lines{
  height:900px;
  display:grid;
  grid-template-rows:repeat(15, 1fr);
  align-items:center;
}

.mushaf-line{
  direction:rtl;
  text-align:center;
  white-space:nowrap;
  min-width:0;
  font-size:39px;
  line-height:1;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}

.word{
  display:inline-block;
  flex:none;
  cursor:default;
}

.word.hidden{
  visibility:hidden;
}

.verse-end{
  display:inline-block;
  flex:none;
  font-family:"UthmanicHafs","Traditional Arabic",serif !important;
  font-size:.75em;
  margin-inline:2px;
  visibility:visible !important;
  border-radius:50%;
  touch-action:manipulation;
  transition:color .12s ease, text-shadow .12s ease;
}

.verse-end.cursor-marker{
  color:var(--cursor-mark);
  text-shadow:0 0 0.25em var(--cursor-mark);
}

.space{
  width:.17em;
  flex:none;
}

.page-number{
  position:absolute;
  bottom:13px;
  left:0;
  right:0;
  text-align:center;
  font-size:13px;
  opacity:.55;
}


.controls-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:6px;
  z-index:9999;
  display:flex;
  justify-content:center;
  padding-inline:0;
  pointer-events:none;
}

.controls{
  pointer-events:auto;
  position:relative;
  width:min(430px,100%);
  display:grid;
  grid-template-rows:34px 34px;
  gap:5px;
  padding:5px 7px;
  border:0;
  border-radius:12px;
  background:transparent;
  box-shadow:none;
}


.control-row{
  width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  direction:rtl;
}

.control-row.primary-controls{
  width:100%;
  justify-content:space-between;
  gap:0;
  padding-inline:2px;
}

.mini-group{
  height:36px;
  display:flex;
  align-items:center;
  direction:ltr;
  border:1px solid #888;
  border-radius:8px;
  overflow:hidden;
  background:var(--button);
}

.mini-group button,
.icon-btn,
.mini-jump button{
  border:0;
  background:var(--button);
  color:var(--ink);
  height:30px;
  min-width:34px;
  padding:0 7px;
  font-size:18px;
  line-height:1;
  cursor:pointer;
}

/* زرا الإظهار والإخفاء هما الأكثر استخداما */
.mini-group button{
  height:34px;
  min-width:44px;
  padding:0 10px;
  font-size:20px;
}

.mini-group button + button{
  border-left:1px solid #888;
}

.mini-symbol{
  height:34px;
  min-width:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 5px;
  font-family:Tahoma,Arial,sans-serif;
  font-size:14px;
  border-left:1px solid #888;
  border-right:1px solid #888;
  background:var(--paper);
  color:var(--ink);
}

.home-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;}

.icon-btn{
  border:1px solid #888;
  border-radius:8px;
  min-width:38px;
}

.icon-btn.on{
  box-shadow:inset 0 0 0 2px var(--cursor-mark);
}

.mini-jump{
  height:32px;
  display:flex;
  align-items:center;
  direction:rtl;
  border:1px solid #888;
  border-radius:8px;
  overflow:hidden;
  background:var(--button);
}

.mini-jump .jump-icon{
  width:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.mini-jump input{
  width:47px;
  height:30px;
  border:0;
  border-inline:1px solid #888;
  outline:0;
  text-align:center;
  font-size:14px;
  background:var(--paper);
  color:var(--ink);
  padding:0;
  -moz-appearance:textfield;
}

.mini-jump input::-webkit-outer-spin-button,
.mini-jump input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.mini-jump button{
  min-width:31px;
  padding:0 5px;
  font-size:16px;
}

.controls button:hover{
  background:var(--button-hover);
}

#status{
  display:none;
}

.error{
  max-width:760px;
  margin:20px auto;
  padding:16px;
  background:#fff;
  border:1px solid #c8bdb0;
  line-height:1.7;
}

@media(max-width:700px){
  .page{
    width:100%;
    max-width:100%;
    height:auto;
    min-height:760px;
    padding:20px 0 34px;
    border-left:0;
    border-right:0;
  }

  .surah-head{
    height:48px;
    margin:0 20px 3px;
    font-size:25px;
  }

  .basmala{
    height:38px;
    font-size:24px;
  }

  .page-lines{
    height:690px;
  }

  .mushaf-line{
    height:44px;
    font-size:clamp(21px,5.7vw,29px);
  }

  .controls{
    width:min(390px,100%);
    gap:4px;
    padding:4px 5px;
    background:transparent;
    border:0;
    box-shadow:none;
  }

  #app{
    margin-bottom:120px;
  }
}

.controls-wrap{
  transition:top .16s ease, bottom .16s ease;
}

.controls-wrap.at-bottom{
  top:auto !important;
  bottom:8px !important;
}

.controls-wrap.at-top{
  top:8px !important;
  bottom:auto !important;
}


/* =========================================================
   وضع قلب الصفحات اليدوي: يعمل فقط عندما Auto-scroll = OFF
   ========================================================= */
body.page-turn-mode{
  overflow:hidden !important;
  overscroll-behavior:none;
}

body.page-turn-mode #app{
  height:100dvh;
  margin:0;
  padding:0;
  overflow:hidden;
  position:relative;
}

body.page-turn-mode #pages{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
  background:var(--desk);
}

body.page-turn-mode .page{
  position:absolute !important;
  top:0;
  left:50%;
  width:min(var(--page-width),100%);
  height:100dvh !important;
  min-height:0 !important;
  margin:0 !important;
  transform:translateX(-50%) translateY(0);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  overflow:hidden;
  transition:transform .18s ease, opacity .18s ease;
}

body.page-turn-mode .page.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  z-index:2;
}

body.page-turn-mode .page.transitioning{
  visibility:visible;
  z-index:3;
}

body.page-turn-mode .page.enter-from-bottom{
  opacity:0;
  transform:translateX(-50%) translateY(7%);
}

body.page-turn-mode .page.enter-from-top{
  opacity:0;
  transform:translateX(-50%) translateY(-7%);
}

body.page-turn-mode .page.exit-to-top{
  opacity:0;
  transform:translateX(-50%) translateY(-7%);
}

body.page-turn-mode .page.exit-to-bottom{
  opacity:0;
  transform:translateX(-50%) translateY(7%);
}

/* في وضع القلب يجب أن تتسع الـ15 سطرا للنافذة */
body.page-turn-mode .page-lines{
  height:calc(100% - 56px) !important;
}

body.page-turn-mode .page.first-page .page-lines{
  height:calc(100% - 166px) !important;
}

@media(max-width:700px){
  body.page-turn-mode .page{
    width:100%;
    max-width:100%;
    height:100dvh !important;
    padding:18px 0 28px !important;
    border-left:0;
    border-right:0;
  }

  body.page-turn-mode .page-lines{
    height:calc(100% - 46px) !important;
  }

  body.page-turn-mode .page.first-page .page-lines{
    height:calc(100% - 130px) !important;
  }
}



/* =========================================================
   وضع التسميع والإحصاءات — طبقة إضافية فوق القارئ الحالي
   لا تغيّر لون حروف المصحف حتى تظل متوافقة مع ألوان التجويد.
   ========================================================= */
.control-row.primary-controls{position:relative}
.primary-center-tools{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  gap:4px;
  direction:rtl;
  z-index:2;
}
.mode-switch{
  height:28px;
  width:88px;
  display:flex;
  direction:rtl;
  overflow:hidden;
  border:1px solid #888;
  border-radius:8px;
  background:var(--button);
}
.mode-switch button{
  width:50%;
  min-width:0;
  height:26px;
  padding:0 3px;
  border:0;
  background:transparent;
  color:var(--ink);
  font-size:11px;
  line-height:1;
}
.mode-switch button.active{
  background:var(--cursor-mark);
  color:var(--paper);
  font-weight:700;
}
.center-icon{
  width:27px;
  min-width:27px !important;
  height:28px !important;
  padding:0 !important;
  border:1px solid #888 !important;
  border-radius:8px;
  font-size:14px !important;
  background:var(--button) !important;
  color:var(--ink) !important;
}
.controls.recitation-active{
  grid-template-rows:36px 34px 34px;
}
.recitation-controls{
  justify-content:space-between;
  gap:4px;
  direction:rtl;
}
.recitation-controls[hidden]{display:none !important}
.recitation-action{
  height:30px;
  min-width:0;
  flex:1 1 auto;
  padding:0 7px;
  border:1px solid #888;
  border-radius:8px;
  background:var(--button);
  color:var(--ink);
  font:700 11px Tahoma,Arial,sans-serif;
  white-space:nowrap;
}
.recitation-action .count{
  display:inline-block;
  min-width:14px;
  margin-inline-start:2px;
  font-variant-numeric:tabular-nums;
}
.recitation-action.danger{border-color:#a95050}
.recitation-action.undo{max-width:38px;font-size:17px}
.recitation-action.end{max-width:49px}
body.recitation-mode #app{margin-bottom:165px}

/* علامات الضعف Layer مستقلة:
   لا نغيّر لون حروف الكلمة ولا font-palette حتى تظل ألوان التجويد مستقلة.
   الدرجات الثلاث متباعدة عمدا في اللون والشكل، لا في الشدة فقط. */
body.show-weakness .word.weak-1{
  background:rgba(255,220,45,.34);
  box-shadow:inset 0 -.13em 0 rgba(218,168,0,.86),0 0 0 1px rgba(218,168,0,.34);
  border-radius:.15em;
}
body.show-weakness .word.weak-2{
  background:rgba(255,143,31,.34);
  box-shadow:inset 0 -.16em 0 rgba(231,101,0,.92),0 0 0 2px rgba(231,101,0,.42),0 0 .15em rgba(231,101,0,.28);
  border-radius:.15em;
}
body.show-weakness .word.weak-3{
  background:rgba(239,74,74,.34);
  box-shadow:inset 0 -.18em 0 rgba(196,30,30,.96),0 0 0 2px rgba(196,30,30,.60),0 0 .28em rgba(196,30,30,.46);
  border-radius:.15em;
}
body.dark.show-weakness .word.weak-1{
  background:rgba(255,223,71,.26);
  box-shadow:inset 0 -.13em 0 rgba(255,199,44,.92),0 0 0 1px rgba(255,199,44,.35);
}
body.dark.show-weakness .word.weak-2{
  background:rgba(255,141,45,.30);
  box-shadow:inset 0 -.16em 0 rgba(255,119,22,.96),0 0 0 2px rgba(255,119,22,.48);
}
body.dark.show-weakness .word.weak-3{
  background:rgba(255,82,82,.31);
  box-shadow:inset 0 -.18em 0 rgba(255,66,66,.98),0 0 0 2px rgba(255,66,66,.62),0 0 .27em rgba(255,66,66,.40);
}

/* فاصل الآية: أصفر ← برتقالي ← أحمر، مع ازدياد سماكة الحلقة. */
body.show-weakness .verse-end.ayah-weak-1{
  background:rgba(255,220,45,.42);
  box-shadow:0 0 0 3px rgba(218,168,0,.72);
}
body.show-weakness .verse-end.ayah-weak-2{
  background:rgba(255,143,31,.44);
  box-shadow:0 0 0 4px rgba(231,101,0,.80),0 0 .18em rgba(231,101,0,.34);
}
body.show-weakness .verse-end.ayah-weak-3{
  background:rgba(239,74,74,.45);
  box-shadow:0 0 0 4px rgba(196,30,30,.90),0 0 .34em rgba(196,30,30,.58);
}
body.dark.show-weakness .verse-end.ayah-weak-1{
  background:rgba(255,223,71,.31);
  box-shadow:0 0 0 3px rgba(255,199,44,.74);
}
body.dark.show-weakness .verse-end.ayah-weak-2{
  background:rgba(255,141,45,.34);
  box-shadow:0 0 0 4px rgba(255,119,22,.82),0 0 .18em rgba(255,119,22,.32);
}
body.dark.show-weakness .verse-end.ayah-weak-3{
  background:rgba(255,82,82,.36);
  box-shadow:0 0 0 4px rgba(255,66,66,.90),0 0 .34em rgba(255,66,66,.56);
}

/* إعادة تشكيل تاريخية للسورة:
   طبقة عرض فقط، منفصلة تماما عن Weakness Score الحالي وعن ألوان التجويد. */
.word.history-weak-1{
  background:rgba(255,229,61,.38);
  box-shadow:inset 0 -.13em 0 rgba(214,171,0,.90),0 0 0 1px rgba(214,171,0,.38);
  border-radius:.15em;
}
.word.history-weak-2{
  background:rgba(255,145,36,.39);
  box-shadow:inset 0 -.16em 0 rgba(226,91,0,.94),0 0 0 2px rgba(226,91,0,.48);
  border-radius:.15em;
}
.word.history-weak-3{
  background:rgba(238,68,68,.42);
  box-shadow:inset 0 -.18em 0 rgba(190,26,26,.98),0 0 0 2px rgba(190,26,26,.66),0 0 .28em rgba(190,26,26,.44);
  border-radius:.15em;
}
.verse-end.history-ayah-1{
  background:rgba(255,229,61,.46);
  box-shadow:0 0 0 3px rgba(214,171,0,.76);
}
.verse-end.history-ayah-2{
  background:rgba(255,145,36,.48);
  box-shadow:0 0 0 4px rgba(226,91,0,.82),0 0 .18em rgba(226,91,0,.34);
}
.verse-end.history-ayah-3{
  background:rgba(238,68,68,.49);
  box-shadow:0 0 0 4px rgba(190,26,26,.92),0 0 .34em rgba(190,26,26,.60);
}
body.dark .word.history-weak-1{background:rgba(255,224,72,.30)}
body.dark .word.history-weak-2{background:rgba(255,143,45,.34)}
body.dark .word.history-weak-3{background:rgba(255,78,78,.37)}
body.dark .verse-end.history-ayah-1{background:rgba(255,224,72,.34)}
body.dark .verse-end.history-ayah-2{background:rgba(255,143,45,.37)}
body.dark .verse-end.history-ayah-3{background:rgba(255,78,78,.40)}

.history-rebuild-box{
  margin:10px 0;
  padding:9px;
  border:1px solid var(--border);
  border-radius:10px;
  background:color-mix(in srgb,var(--paper) 94%,var(--button) 6%);
}
.history-rebuild-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}
.history-rebuild-row{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}
.history-rebuild-row select{
  flex:1 1 250px;
  min-width:0;
  height:34px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--button);
  color:var(--ink);
  padding:0 8px;
}
.history-rebuild-row button{
  height:34px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--button);
  color:var(--ink);
  padding:0 10px;
}
.history-rebuild-note{
  margin-top:6px;
  font-size:11px;
  line-height:1.6;
  opacity:.72;
}
#statsOpen.history-active{
  outline:2px solid rgba(226,91,0,.86);
  outline-offset:1px;
  box-shadow:0 0 .22em rgba(226,91,0,.48);
}

/* تأكيد لحظي مستقل عن خيار إظهار علامات الضعف */
.word.assist-flash{
  border-radius:.15em;
  animation:wordAssistFlash 1.05s ease-out;
}
@keyframes wordAssistFlash{
  0%{
    background:rgba(255,225,35,.62);
    box-shadow:0 0 0 .14em rgba(255,149,0,.92),0 0 .44em rgba(255,92,0,.62);
  }
  45%{
    background:rgba(255,166,35,.42);
    box-shadow:0 0 0 .10em rgba(255,111,0,.66),0 0 .27em rgba(255,92,0,.38);
  }
  100%{
    background:transparent;
    box-shadow:none;
  }
}
.verse-end.ayah-assist-flash{
  animation:ayahAssistFlash 1.15s ease-out;
}

/* الآيات التي احتاجت Ayah Assist في الجلسة الحالية:
   علامة مستقلة عن show-weakness حتى يكون التسجيل واضحا فوريا. */
.verse-end.session-ayah-assist{
  outline:3px solid rgba(196,30,30,.74);
  outline-offset:2px;
}
body.dark .verse-end.session-ayah-assist{
  outline-color:rgba(255,82,82,.82);
}
@keyframes ayahAssistFlash{
  0%{
    background:rgba(255,72,72,.62);
    box-shadow:0 0 0 5px rgba(218,24,24,.92),0 0 .55em rgba(218,24,24,.72);
  }
  50%{
    background:rgba(255,138,41,.40);
    box-shadow:0 0 0 4px rgba(238,81,0,.68),0 0 .30em rgba(238,81,0,.44);
  }
  100%{
    background:transparent;
    box-shadow:none;
  }
}

/* تأكيد بصري لحظي للكلمة التي سُجّل عليها خطأ يدوي.
   لا نغيّر لون الحروف حتى تظل طبقة التجويد مستقلة. */
.word.manual-error-flash{
  position:relative;
  border-radius:.14em;
  animation:manualErrorFlash .9s ease-out;
}
@keyframes manualErrorFlash{
  0%{
    background:rgba(196,63,40,.30);
    box-shadow:0 0 0 .10em rgba(196,63,40,.65), 0 0 .28em rgba(196,63,40,.38);
  }
  55%{
    background:rgba(196,63,40,.17);
    box-shadow:0 0 0 .07em rgba(196,63,40,.42);
  }
  100%{
    background:transparent;
    box-shadow:none;
  }
}

.event-list{
  display:grid;
  gap:7px;
  margin-top:7px;
}
.event-card{
  border:1px solid var(--border);
  border-radius:10px;

<script src="./surahs.js"></script>
<script>
const params=new URLSearchParams(location.search);
const SURAH=getSurahConfig(params.get("surah")||2);
if(!SURAH || !SURAH.enabled){ location.replace("./index.html"); throw new Error("Surah unavailable"); }
document.title=`${SURAH.name} — مصحف الحفظ`;
document.getElementById("readerHeading").textContent=`سورة ${SURAH.name} — مصحف المدينة`;
const FIRST_PAGE = SURAH.firstPage;
const LAST_PAGE = SURAH.lastPage;
const DATA_CACHE = `qcf_v2_surah_${SURAH.number}_${FIRST_PAGE}_${LAST_PAGE}_${SURAH.cacheVersion||"v1"}`;
const STATE_KEY = `quran_reader_state_${SURAH.number}_v1`;

const API_BASE = "https://api.quran.com/api/v4";
const MUSHAF_ID = 1; // QCF V2 / Madani Mushaf, 604 pages, 15 lines
const MUSHAF_LINES_PER_PAGE = 15;
const FONT_BASE = "https://verses.quran.foundation/fonts/quran/hafs/v2/woff2";

let pageData = [];
let hideable = [];
let visibleCount = 0;
let ayahStarts = Array(SURAH.ayahCount+1).fill(undefined);
let ayahEnds = Array(SURAH.ayahCount+1).fill(undefined);
let loadedFonts = new Set();
let autoScroll = true;
let darkMode = localStorage.getItem("mushaf_theme") === "dark";

let pageStarts = {};
let pageFirstAyah = {};
let currentNavPage = FIRST_PAGE;

/* الفاصل الملوّن الذي يمثّل موضع المؤشر */
let cursorVerse = null;

/* مزامنة السكرول اليدوي */
let touchScrolling = false;
let scrollSyncTimer = null;
let touchStartPage = FIRST_PAGE;
let navScrollRaf = 0;

/* كشف النقر المزدوج على فاصل الآية */
let lastVerseTap = { verse:null, time:0 };

/* وضع قلب الصفحات عند إيقاف Auto-scroll */
let activePage = FIRST_PAGE;
let pageTurning = false;
let cursorTokenIndex = 0;
let pendingTurnRequest = null;
let swipeStartY = 0;
let swipeStartX = 0;
let swipeTracking = false;


/*
  Override يدوي لموضع الشريط في الصفحة الحالية فقط.
  null = الوضع التلقائي.
*/
let controlsManualPosition = null;   // "top" | "bottom" | null
let controlsManualPage = null;


function isEnd(word){
  return word.char_type_name === "end";
}

function verseNumber(word, verse){
  const key = word.verse_key || verse.verse_key || "";
  const n = parseInt(String(key).split(":")[1],10);
  return Number.isFinite(n) ? n : null;
}

async function loadPageFont(page){
  const name = `qcf-p${page}-v2`;
  if(loadedFonts.has(page)) return name;

  const font = new FontFace(
    name,
    `url("${FONT_BASE}/p${page}.woff2") format("woff2")`
  );

  font.display = "block";
  await font.load();
  document.fonts.add(font);
  loadedFonts.add(page);
  return name;
}

function qcfV2PageOf(word){
  const v2=Number(word?.v2_page);
  if(Number.isFinite(v2) && v2>0) return v2;

  const selected=Number(word?.page_number);
  return Number.isFinite(selected) && selected>0 ? selected : null;
}

function qcfV2LineOf(word){
  const v2=Number(word?.line_v2);
  if(Number.isFinite(v2) && v2>0) return v2;

  const selected=Number(word?.line_number);
  return Number.isFinite(selected) && selected>0 ? selected : null;
}

function mushafIntegrityError(page,message,details={}){
  const err=new Error(`خطأ سلامة في صفحة ${page}: ${message}`);
  err.code="MUSHAF_INTEGRITY";
  err.page=page;
  err.details=details;
  return err;
}

function validatePageIntegrity(page,tokens,sourceWords){
  if(!Array.isArray(sourceWords) || sourceWords.length===0){
    throw mushafIntegrityError(page,"لم تصل كلمات الصفحة من مصدر المصحف.");
  }

  if(!Array.isArray(tokens) || tokens.length===0){
    throw mushafIntegrityError(page,"تم جلب الصفحة لكن لم يبق أي عنصر صالح للرسم.");
  }

  const badLines=tokens.filter(t=>
    !Number.isFinite(Number(t.line)) ||
    Number(t.line)<1 ||
    Number(t.line)>MUSHAF_LINES_PER_PAGE
  );

  if(badLines.length){
    throw mushafIntegrityError(
      page,
      `وجد ${badLines.length} عنصر خارج نطاق الأسطر 1–${MUSHAF_LINES_PER_PAGE}.`,
      {badLines:badLines.slice(0,8)}
    );
  }

  const invalidVerses=tokens.filter(t=>!(Number(t.verse)>0));
  if(invalidVerses.length){
    throw mushafIntegrityError(
      page,
      `وجد ${invalidVerses.length} عنصر بلا رقم آية صالح.`
    );
  }

  const sourceOnPage=sourceWords.filter(x=>qcfV2PageOf(x.word)===Number(page));

  /*
    أهم invariant: كل عنصر تابع لهذه السورة وله v2_page=الصفحة المطلوبة
    يجب أن يصل إلى tokens. أي فرق هنا يعني أننا أسقطنا كلمة/فاصل بصمت.
  */
  if(sourceOnPage.length!==tokens.length){
    throw mushafIntegrityError(
      page,
      `عدد عناصر QCF V2 في المصدر (${sourceOnPage.length}) لا يساوي عدد العناصر المعدة للرسم (${tokens.length}).`
    );
  }

  // الكلمات العادية في QCF V2 يجب أن تحمل glyph code.
  const missingGlyph=tokens.filter(t=>
    !isEnd(t) &&
    t.char_type_name==="word" &&
    !String(t.code_v2||"").trim()
  );
  if(missingGlyph.length){
    throw mushafIntegrityError(
      page,
      `وجد ${missingGlyph.length} كلمة بلا code_v2.`
    );
  }

  return true;
}

async function fetchPage(page){
  const url =
    `${API_BASE}/verses/by_page/${page}` +
    `?words=true` +
    `&mushaf=${MUSHAF_ID}` +
    `&word_fields=code_v2,text_qpc_hafs,text_uthmani,location,v2_page,line_v2,line_number,page_number` +
    `&per_page=50`;

  const res = await fetch(url);
  if(!res.ok) throw new Error(`تعذر تحميل الصفحة ${page} (${res.status})`);

  const json = await res.json();
  const verses = Array.isArray(json.verses) ? json.verses : [];

  const tokens = [];
  const sourceWords = [];

  verses.forEach(verse => {
    if(
      verse.chapter_id !== SURAH.number &&
      !String(verse.verse_key || "").startsWith(`${SURAH.number}:`)
    ){
      return;
    }

    (verse.words || []).forEach(word => {
      sourceWords.push({word,verse});

      /*
        نربط glyph code_v2 بالصفحة/السطر الخاصين بـQCF V2.
        v2_page/line_v2 لهما الأولوية، ثم page_number/line_number
        كـfallback لأن الطلب نفسه مثبت على mushaf=1.
      */
      const v2Page=qcfV2PageOf(word);
      if(v2Page!==Number(page)) return;

      const line=qcfV2LineOf(word);
      if(!(line>=1 && line<=MUSHAF_LINES_PER_PAGE)){
        throw mushafIntegrityError(
          page,
          `العنصر ${word.location||word.verse_key||""} له سطر QCF V2 غير صالح: ${line}.`
        );
      }

      tokens.push({
        page,
        line,
        verse:verseNumber(word,verse),
        position:Number(word.position || 0),
        location:String(word.location || ""),
        char_type_name:word.char_type_name || "word",
        code_v2:word.code_v2 || "",
        text_qpc_hafs:word.text_qpc_hafs || word.text_uthmani || "",
        text_uthmani:word.text_uthmani || "",
        juz:Number(verse.juz_number || 0),
        hizb:Number(verse.hizb_number || 0)
      });
    });
  });

  validatePageIntegrity(page,tokens,sourceWords);
  return {page,tokens};
}

async function loadAllPages(){
  /* Cache Storage في الـService Worker هو مخزن بيانات الصفحات والخطوط. */
  const result = [];
  const batchSize = 4;

  for(let start=FIRST_PAGE; start<=LAST_PAGE; start+=batchSize){
    const nums = [];
    for(let p=start; p<start+batchSize && p<=LAST_PAGE; p++) nums.push(p);

    document.getElementById("loading").textContent =
      `جار تحميل الصفحات ${nums[0]}–${nums[nums.length-1]} من مصحف المدينة…`;

    const batch = await Promise.all(nums.map(fetchPage));
    result.push(...batch);
  }

  pageData = result.sort((a,b)=>a.page-b.page);
  await prepareAndRender();
}

async function prepareAndRender(){
  document.getElementById("loading").textContent =
    "جار تحميل خطوط QCF V2 الخاصة بالصفحات…";

  // الخطوط صفحة بصفحة؛ المتصفح يخزنها تلقائيا بعد التحميل.
  await Promise.all(
    pageData.map(p =>
      loadPageFont(p.page).catch(err => {
        console.warn("Font load failed",p.page,err);
        return null;
      })
    )
  );

  buildIndexes();
  renderPages();

  document.getElementById("pageInput").min=FIRST_PAGE;
  document.getElementById("pageInput").max=LAST_PAGE;
  document.getElementById("ayahInput").max=SURAH.ayahCount;

  const saved=loadReaderState();
  if(saved){
    visibleCount=Math.max(0,Math.min(hideable.length,Number(saved.visibleCount)||0));
    cursorTokenIndex=Math.max(0,Math.min(hideable.length-1,Number(saved.cursorTokenIndex)||Math.max(0,visibleCount-1)));
    currentNavPage=Math.max(FIRST_PAGE,Math.min(LAST_PAGE,Number(saved.page)||FIRST_PAGE));
    activePage=currentNavPage;
    touchStartPage=currentNavPage;
    autoScroll=saved.autoScroll!==false;
    const token=currentBoundaryToken();
    document.getElementById("pageInput").value=currentNavPage;
    document.getElementById("ayahInput").value=token?.verse||pageFirstAyah[currentNavPage]||1;
    cursorVerse=token?.verse||1;
    updateVisibility();
    if(autoScroll){
      controlsToBottom();
      requestAnimationFrame(()=>{const el=pageElement(currentNavPage); if(el) el.scrollIntoView({behavior:"auto",block:"center"});});
    }else{
      const btn=document.getElementById("autoScrollToggle"); btn.classList.remove("on"); btn.setAttribute("aria-pressed","false");
      enterPageTurnMode();
    }
  }else{
    currentNavPage=FIRST_PAGE; touchStartPage=FIRST_PAGE; activePage=FIRST_PAGE;
    document.getElementById("pageInput").value=FIRST_PAGE;
    document.getElementById("ayahInput").value=pageFirstAyah[FIRST_PAGE] || 1;
    cursorVerse=pageFirstAyah[FIRST_PAGE] || 1;
    cursorTokenIndex=pageStarts[FIRST_PAGE]||0;
    updateVisibility();
  }

  document.getElementById("loading").style.display="none";
  initRecitationAfterRender();
  updateStatus();
}

function buildIndexes(){
  hideable = [];
  ayahStarts.fill(undefined);
  ayahEnds.fill(undefined);
  pageStarts = {};
  pageFirstAyah = {};

  let idx = 0;
  const verseWordCounter = {};

  pageData.forEach(p => {
    p.tokens.forEach(t => {
      if(!t.verse) return;

      if(!isEnd(t)){
        /*
          هوية الكلمة يجب أن تكون فريدة داخل الآية.
          بعض الاستجابات/الكاشات القديمة قد لا تحمل position بصورة صالحة.
          نستخدم position إن كان صحيحا، ثم location إن وجد، وإلا نشتقه
          من ترتيب الكلمات الفعلي عبر صفحات السورة. هذا لا يغيّر العرض.
        */
        const verseNo=Number(t.verse)||0;
        const previous=Number(verseWordCounter[verseNo])||0;

        let pos=Number(t.position)||0;

        if(!(pos>0) && t.location){
          const locParts=String(t.location).split(":");
          const locPos=parseInt(locParts[locParts.length-1],10);
          if(Number.isFinite(locPos) && locPos>0) pos=locPos;
        }

        // إذا كان الرقم مفقودا أو مكررا، نضمن ترتيبا تصاعديا فريدا.
        if(!(pos>previous)) pos=previous+1;

        t.position=pos;
        verseWordCounter[verseNo]=pos;

        if(pageStarts[p.page] === undefined){
          pageStarts[p.page] = idx;
          pageFirstAyah[p.page] = t.verse;
        }

        if(ayahStarts[t.verse] === undefined){
          ayahStarts[t.verse] = idx;
        }

        t.hideIndex = idx;
        hideable.push(t);
        idx++;
        ayahEnds[t.verse] = idx;
      }else{
        t.hideIndex = null;
      }
    });
  });
}

function renderPages(){
  const root = document.getElementById("pages");
  root.innerHTML="";

  pageData.forEach(p => {
    const page = document.createElement("section");
    page.className="page" + (p.page===FIRST_PAGE ? " first-page" : "");
    page.id=`page-${p.page}`;

    // رأس السورة والبسملة في الصفحة الأولى من السورة.
    if(p.page === FIRST_PAGE){
      const head = document.createElement("div");
      head.className="surah-head";
      head.textContent=`سُورَةُ ${SURAH.name}`;
      page.appendChild(head);

      if(SURAH.number!==1 && SURAH.number!==9){
        const basmala = document.createElement("div");
        basmala.className="basmala";
        basmala.textContent="بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
        page.appendChild(basmala);
      }
    }

    const linesBox = document.createElement("div");
    linesBox.className="page-lines";

    const byLine = new Map();
    for(let i=1;i<=MUSHAF_LINES_PER_PAGE;i++) byLine.set(i,[]);

    p.tokens.forEach(t => {
      if(!(t.line>=1 && t.line<=MUSHAF_LINES_PER_PAGE)){
        throw mushafIntegrityError(
          p.page,
          `محاولة رسم عنصر في سطر غير صالح: ${t.line}.`
        );
      }
      byLine.get(t.line).push(t);
    });

    for(let lineNo=1; lineNo<=MUSHAF_LINES_PER_PAGE; lineNo++){
      const line = document.createElement("div");
      line.className="mushaf-line";
      line.dataset.line=lineNo;
      line.style.fontFamily=`qcf-p${p.page}-v2`;

      const tokens = byLine.get(lineNo);

      tokens.forEach((t,i) => {
        const span = document.createElement("span");

        if(isEnd(t)){
          span.className="verse-end";
          span.dataset.ayahKey=`${SURAH.number}:${t.verse}`;
          // توصي وثائق QCF بعرض فاصل الآية بخط Unicode.
          span.textContent=t.text_qpc_hafs || `﴿${t.verse || ""}﴾`;
          span.id=t.verse ? `ayah-${t.verse}` : "";
          span.dataset.verse=t.verse || "";

          if(t.verse){
            span.addEventListener("pointerup",()=>{
              const now=Date.now();

              if(lastVerseTap.verse===t.verse && now-lastVerseTap.time<=420){
                moveCursorToVerseSeparator(t.verse);
                lastVerseTap={verse:null,time:0};
              }else{
                lastVerseTap={verse:t.verse,time:now};
              }
            });
          }
        }else{
          span.className="word";
          span.dataset.hideIndex=t.hideIndex;
          span.dataset.wordKey=wordKey(t);

          if(t.hideIndex >= visibleCount){
            span.classList.add("hidden");
          }

          if(t.code_v2){
            // QCF glyph codes يجب أن تُعرض مع خط الصفحة الخاص بها.
            span.innerHTML=t.code_v2;
          }else{
            span.style.fontFamily="UthmanicHafs,serif";
            span.textContent=t.text_qpc_hafs || t.text_uthmani;
          }
        }

        line.appendChild(span);

        if(i < tokens.length-1){
          const space=document.createElement("span");
          space.className="space";
          line.appendChild(space);
        }
      });

      linesBox.appendChild(line);
    }

    page.appendChild(linesBox);

    const number=document.createElement("div");
    number.className="page-number";
    number.textContent=`صفحة ${p.page}`;
    page.appendChild(number);

    root.appendChild(page);
  });
}

function updateVisibility(){
  document.querySelectorAll(".word").forEach(el => {
    const idx=Number(el.dataset.hideIndex);
    el.classList.toggle("hidden",idx >= visibleCount);
  });

  document.querySelectorAll(".verse-end").forEach(el => {
    el.classList.toggle(
      "cursor-marker",
      cursorVerse !== null && Number(el.dataset.verse) === cursorVerse
    );
  });

  updateWeaknessHighlights();
  updateStatus();
}

function boundaryVerse(){
  if(!hideable.length) return 1;
  if(visibleCount >= hideable.length) return hideable[hideable.length-1].verse;
  return hideable[Math.max(0,visibleCount)].verse;
}

function syncAyahFieldToBoundary(){
  const a=boundaryVerse();
  if(a){
    document.getElementById("ayahInput").value=a;
    cursorVerse=a;
  }
}

function coreShowNextWord(){
  if(visibleCount < hideable.length){
    const affectedIndex=visibleCount;
    const affected=hideable[affectedIndex];

    visibleCount++;
    setCursorToken(affectedIndex);
    updateVisibility();

    if(autoScroll){
      controlsToBottom();
      ensureBoundaryVisible();
      syncPageFieldFromViewport();
    }else{
      syncManualDisplayToToken(affected);
    }
  }
  saveReaderState();
}

function hidePreviousWord(){
  if(visibleCount > 0){
    visibleCount--;

    const affectedIndex=visibleCount;
    const affected=hideable[affectedIndex];

    setCursorToken(affectedIndex);
    updateVisibility();

    if(autoScroll){
      controlsToBottom();
      ensureBoundaryVisible();
      syncPageFieldFromViewport();
    }else{
      syncManualDisplayToToken(affected);
    }
  }
  saveReaderState();
}

function coreShowNextAyah(){
  if(visibleCount >= hideable.length) return;

  const first=hideable[visibleCount];
  const a=first.verse;

  if(a && ayahEnds[a] !== undefined){
    visibleCount=ayahEnds[a];

    const affectedIndex=Math.max(0,visibleCount-1);
    const affected=hideable[affectedIndex];

    setCursorToken(affectedIndex);
    updateVisibility();

    if(autoScroll){
      controlsToBottom();
      scrollToAyah(a);
      syncPageFieldFromViewport();
    }else{
      syncManualDisplayToToken(affected);
    }
  }
  saveReaderState();
}

function hidePreviousAyah(){
  if(visibleCount <= 0) return;

  const prev=hideable[visibleCount-1];
  const a=prev.verse;

  if(a && ayahStarts[a] !== undefined){
    visibleCount=ayahStarts[a];

    const affectedIndex=Math.min(
      hideable.length-1,
      ayahStarts[a]
    );
    const affected=hideable[affectedIndex];

    setCursorToken(affectedIndex);
    updateVisibility();

    if(autoScroll){
      controlsToBottom();
      scrollToAyah(a);
      syncPageFieldFromViewport();
    }else{
      syncManualDisplayToToken(affected);
    }
  }
  saveReaderState();
}


/*
  في وضع التسميع:
  - السهم العادي = تقدمت في التسميع ثم كشفت للتحقق (Clean pass).
  - زر ك+ / ۝+ = طلب مساعدة صريح.
  هذا الفصل ضروري لأن التطبيق لا يستخدم Speech Recognition ولا يستطيع معرفة
  هل الكشف سبق النطق أم جاء بعده للتحقق.
*/
function showNextWord(options={}){
  if(visibleCount >= hideable.length){
    coreShowNextWord();
    return;
  }

  const target=hideable[visibleCount];
  const before=captureReaderPosition();
  let event=null;

  if(recitationMode && activeSession && target){
    if(options.assist){
      event=recordWordAssist(target,before);
    }else if(!alreadyPassedWord(target)){
      noteCleanWordProgress(target);
    }
  }

  coreShowNextWord();

  if(recitationMode && activeSession && target){
    markWordPassed(target);
    trackSessionToken(target);
    if(event){
      event.after=captureReaderPosition();
      saveRecitationData();
      flashWordAssistToken(target);
    }
    updateSessionControls();
    updateControlsPositionByPage();
  }
}

function showNextAyah(options={}){
  if(visibleCount >= hideable.length){
    coreShowNextAyah();
    return;
  }

  const first=hideable[visibleCount];
  const ayah=first?.verse;
  const before=captureReaderPosition();
  let event=null;

  if(recitationMode && activeSession && ayah){
    if(options.assist){
      event=recordAyahAssist(first,before);
    }else if(!alreadyPassedAyah(ayah)){
      noteCleanAyahProgress(ayah);
    }
  }

  coreShowNextAyah();

  if(recitationMode && activeSession && ayah){
    markAyahPassed(ayah);
    tokensOfAyah(ayah).forEach(markWordPassed);
    tokensOfAyah(ayah).forEach(trackSessionToken);
    if(event){
      event.after=captureReaderPosition();
      saveRecitationData();
      flashAyahAssistMarker(ayah);
    }
    updateSessionControls();
    updateControlsPositionByPage();
  }
}

function scrollToAyah(a){
  const el=document.getElementById(`ayah-${a}`);
  if(el){
    el.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }

  const token=hideable.find(x=>x.verse===a);
  if(token) scrollToPage(token.page);
}

function scrollToPage(p){
  const el=document.getElementById(`page-${p}`);
  if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
}

function ensureBoundaryVisible(){
  if(visibleCount >= hideable.length){
    scrollToPage(LAST_PAGE);
    return;
  }

  const token=hideable[visibleCount];
  const page=document.getElementById(`page-${token.page}`);
  if(!page) return;

  const r=page.getBoundingClientRect();
  if(r.bottom < 120 || r.top > window.innerHeight-120){
    page.scrollIntoView({behavior:"smooth",block:"center"});
  }
}

/* نقل المؤشر إلى فاصل آية بعينه بالنقر المزدوج */
function moveCursorToVerseSeparator(verse){
  if(!verse || ayahEnds[verse] === undefined) return;

  visibleCount=ayahEnds[verse];

  const affectedIndex=Math.max(0,visibleCount-1);
  const affected=hideable[affectedIndex];

  setCursorToken(affectedIndex);
  updateVisibility();

  if(autoScroll){
    const el=document.getElementById(`ayah-${verse}`);
    if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
  }else{
    syncManualDisplayToToken(affected);
  }
}

/* الصفحة الأقرب إلى مركز الشاشة أثناء السكرول اليدوي */
function getViewportPage(){
  const pages=[...document.querySelectorAll(".page")];
  if(!pages.length) return null;

  const center=window.innerHeight/2;
  let best=null;
  let bestDist=Infinity;

  for(const page of pages){
    const r=page.getBoundingClientRect();

    /* نفضّل الصفحة التي يحتوي جسمها مركز الشاشة */
    let dist=0;
    if(center < r.top) dist=r.top-center;
    else if(center > r.bottom) dist=center-r.bottom;

    if(dist < bestDist){
      bestDist=dist;
      best=page;
    }
  }

  return best ? Number(best.id.replace("page-","")) : null;
}

/*
  عند السكرول باللمس إلى صفحة جديدة:
  - نحدّث خانة الصفحة.
  - نضع رقم أول آية موجودة في الصفحة.
  - ننقل حد الإظهار إلى أول كلمة في الصفحة.
*/
function updateDisplayedPageFromViewport(){
  const p=getViewportPage();
  if(!p || pageStarts[p] === undefined) return null;

  currentNavPage=p;
  document.getElementById("pageInput").value=p;
  trackSessionPageByNumber(p);
  return p;
}

function rebaseCursorToPage(p){
  if(!p || pageStarts[p] === undefined) return;

  currentNavPage=p;
  document.getElementById("pageInput").value=p;

  visibleCount=pageStarts[p];
  cursorTokenIndex=pageStarts[p];

  const firstAyah=pageFirstAyah[p] || 1;
  document.getElementById("ayahInput").value=firstAyah;
  cursorVerse=firstAyah;

  controlsLastPage=p;
  controlsPageEnteredAt=performance.now();
  controlsToBottom();
  trackSessionPageByNumber(p);

  updateVisibility();
}

/*
  السكرول اليدوي إلى صفحة جديدة يجعل الصفحة الجديدة هي مرجع
  الإظهار/الإخفاء فوراً، فلا يستمر المؤشر من صفحة قديمة.
*/
function syncCursorToVisiblePage(){
  const p=updateDisplayedPageFromViewport();
  if(!p) return;

  if(p !== touchStartPage){
    rebaseCursorToPage(p);
    touchStartPage=p;
  }
}

function updateStatus(){
  const box=document.getElementById("status");

  if(!hideable.length){
    box.textContent="";
    return;
  }

  if(visibleCount===0){
    box.textContent=`كل الكلمات مخفية — الإظهار يبدأ من أول كلمة في سورة ${SURAH.name}`;
    return;
  }

  if(visibleCount>=hideable.length){
    box.textContent=`سورة ${SURAH.name} كلها ظاهرة — فواصل الآيات باقية دائما`;
    return;
  }

  const next=hideable[visibleCount];
  const prev=hideable[visibleCount-1];

  box.textContent=
    `الإظهار التالي: الآية ${next.verse}، الصفحة ${next.page}` +
    ` — الإخفاء التالي: الآية ${prev.verse}، الصفحة ${prev.page}`;
}


/* -------------------------
   Helpers for hybrid modes
-------------------------- */
function currentBoundaryToken(){
  if(!hideable.length) return null;

  const idx=Math.max(
    0,
    Math.min(hideable.length-1, Number(cursorTokenIndex) || 0)
  );

  return hideable[idx];
}

function setCursorToken(index){
  if(!hideable.length) return null;

  cursorTokenIndex=Math.max(
    0,
    Math.min(hideable.length-1,index)
  );

  const token=hideable[cursorTokenIndex];

  if(token){
    document.getElementById("ayahInput").value=token.verse;
    cursorVerse=token.verse;
    trackSessionToken(token);
  }

  return token;
}

function syncPageFieldFromViewport(){
  const page=currentVisiblePageElement();
  if(!page) return;

  const p=Number(String(page.id).replace("page-",""));
  if(!Number.isFinite(p)) return;

  currentNavPage=p;
  document.getElementById("pageInput").value=p;
}

function syncAyahFieldToBoundary(){
  const token=currentBoundaryToken();
  if(token){
    document.getElementById("ayahInput").value=token.verse;
    cursorVerse=token.verse;
  }
}


function syncManualDisplayToToken(token){
  if(autoScroll || !token) return;

  const targetPage=Number(token.page);
  if(!Number.isFinite(targetPage)) return;

  currentNavPage=targetPage;
  document.getElementById("pageInput").value=targetPage;
  document.getElementById("ayahInput").value=token.verse;

  if(targetPage !== activePage){
    turnToPage(
      targetPage,
      targetPage > activePage ? 1 : -1,
      false
    );
  }

  controlsFromManualCursor();
}

function controlsFromManualCursor(){
  const pageNo=activePage||currentNavPage||FIRST_PAGE;
  if(controlsManualPage===pageNo && controlsManualPosition){
    if(controlsManualPosition==="top") controlsToTop(); else controlsToBottom();
    return;
  }
  const token=currentBoundaryToken();
  if(token && token.page===pageNo && Number(token.line)>=12) controlsToTop();
  else controlsToBottom();
}

/* -------------------------
   Page-turner only when OFF
-------------------------- */
function pageElement(pageNo){
  return document.getElementById(`page-${pageNo}`);
}

function activatePageInstant(pageNo){
  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove(
      "active","transitioning",
      "enter-from-bottom","enter-from-top",
      "exit-to-top","exit-to-bottom"
    );
  });

  const page=pageElement(pageNo);
  if(page) page.classList.add("active");

  activePage=pageNo;
  currentNavPage=pageNo;
  document.getElementById("pageInput").value=pageNo;
}

function resetCursorToPage(pageNo){
  if(pageStarts[pageNo] === undefined) return;

  if(controlsManualPage!==pageNo){
    controlsManualPosition=null;
    controlsManualPage=null;
  }

  visibleCount=pageStarts[pageNo];
  cursorTokenIndex=pageStarts[pageNo];
  activePage=pageNo;
  currentNavPage=pageNo;

  const firstAyah=pageFirstAyah[pageNo] || 1;
  document.getElementById("pageInput").value=pageNo;
  document.getElementById("ayahInput").value=firstAyah;

  cursorVerse=firstAyah;
  setCursorToken(pageStarts[pageNo]);
  updateVisibility();
  controlsFromManualCursor();
}

function turnToPage(pageNo,direction=1,resetCursor=true){
  pageNo=Math.max(FIRST_PAGE,Math.min(LAST_PAGE,pageNo));

  if(pageNo===activePage && !pageTurning){
    if(resetCursor){
      resetCursorToPage(pageNo);
    }else{
      document.getElementById("pageInput").value=pageNo;
      controlsFromManualCursor();
    }
    return;
  }

  /*
    لا نهمل ضغطات المستخدم أثناء حركة الصفحة.
    نخزن آخر صفحة مطلوبة، وبعد نهاية الحركة ننفذها.
  */
  if(pageTurning){
    pendingTurnRequest={pageNo,direction,resetCursor};
    return;
  }

  const oldPage=pageElement(activePage);
  const newPage=pageElement(pageNo);
  if(!newPage) return;

  pageTurning=true;

  const enterClass=direction>0 ? "enter-from-bottom" : "enter-from-top";
  const exitClass=direction>0 ? "exit-to-top" : "exit-to-bottom";

  newPage.classList.add("transitioning",enterClass);

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(oldPage){
        oldPage.classList.add("transitioning",exitClass);
        oldPage.classList.remove("active");
      }

      newPage.classList.remove(enterClass);
      newPage.classList.add("active");
    });
  });

  setTimeout(()=>{
    if(oldPage){
      oldPage.classList.remove("transitioning",exitClass);
    }

    newPage.classList.remove("transitioning");

    activePage=pageNo;
    currentNavPage=pageNo;
    document.getElementById("pageInput").value=pageNo;

    if(resetCursor){
      resetCursorToPage(pageNo);
    }else{
      controlsFromManualCursor();
    }

    pageTurning=false;

    const pending=pendingTurnRequest;
    pendingTurnRequest=null;

    if(pending && pending.pageNo !== activePage){
      turnToPage(
        pending.pageNo,
        pending.pageNo > activePage ? 1 : -1,
        pending.resetCursor
      );
    }
  },190);
}

function nextPageManual(){
  if(activePage < LAST_PAGE){
    turnToPage(activePage+1,1,true);
  }
}

function previousPageManual(){
  if(activePage > FIRST_PAGE){
    turnToPage(activePage-1,-1,true);
  }
}

function enterPageTurnMode(){
  const page=currentVisiblePageElement();
  const p=page ? Number(String(page.id).replace("page-","")) : currentNavPage;

  activePage=Number.isFinite(p) ? p : FIRST_PAGE;
  document.body.classList.add("page-turn-mode");
  activatePageInstant(activePage);

  const token=currentBoundaryToken();

  if(!token || token.page !== activePage){
    resetCursorToPage(activePage);
  }else{
    document.getElementById("pageInput").value=activePage;
    document.getElementById("ayahInput").value=token.verse;
    controlsFromManualCursor();
  }
}

function leavePageTurnMode(){
  document.body.classList.remove("page-turn-mode");

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove(
      "active","transitioning",
      "enter-from-bottom","enter-from-top",
      "exit-to-top","exit-to-bottom"
    );
  });

  /*
    نرجع للصفحة نفسها في وضع الـscroll ثم نبقي الشريط بالأسفل.
  */
  requestAnimationFrame(()=>{
    const page=pageElement(activePage);
    if(page){
      page.scrollIntoView({behavior:"auto",block:"center"});
    }
    controlsToBottom();
  });
}


document.getElementById("showWord").onclick=showNextWord;
document.getElementById("hideWord").onclick=hidePreviousWord;
document.getElementById("showAyah").onclick=showNextAyah;
document.getElementById("hideAyah").onclick=hidePreviousAyah;

function navigatePageWithoutRevealReset(pageNo){
  pageNo=Math.max(FIRST_PAGE,Math.min(LAST_PAGE,Number(pageNo)||FIRST_PAGE));

  currentNavPage=pageNo;
  document.getElementById("pageInput").value=pageNo;

  // في التسميع: زر الصفحة يغيّر الصفحة المعروضة فقط، ولا يغيّر موضع التسميع أو حالة الكشف.
  if(autoScroll){
    const el=pageElement(pageNo);
    if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    controlsToBottom();
  }else{
    turnToPage(pageNo,pageNo>=activePage?1:-1,false);
  }

  saveReaderState();
}

document.getElementById("pageJump").onclick=()=>{
  let n=parseInt(document.getElementById("pageInput").value,10);
  n=Math.max(FIRST_PAGE,Math.min(LAST_PAGE,Number.isFinite(n)?n:FIRST_PAGE));
  document.getElementById("pageInput").value=n;

  if(recitationMode && activeSession){
    navigatePageWithoutRevealReset(n);
    return;
  }

  if(autoScroll){
    resetCursorToPage(n);
    const el=pageElement(n);
    if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    controlsToBottom();

document.getElementById("ayahJump").onclick=()=>{
