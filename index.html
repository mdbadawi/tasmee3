<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece8df">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مصحف الحفظ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<main class="app-shell">
  <div class="hero">
    <div><h1>مصحف الحفظ</h1><p>كشف الكلمات والآيات على صفحات مصحف المدينة</p></div>
    <button id="installBtn" class="install-btn" hidden>تثبيت</button>
  </div>

  <section id="resumeCard" class="resume-card">
    <div class="resume-title">متابعة القراءة</div>
    <div id="resumeMeta" class="resume-meta"></div>
    <div class="resume-actions"><a id="resumeBtn" class="resume-btn" href="./reader.html?surah=2">فتح</a></div>
  </section>

  <section class="offline-box">
    <div class="offline-heading">
      <b>المصحف كاملا دون إنترنت</b><br>
      <span>نزّل بيانات الصفحات الـ604 وخطوط QCF مرة واحدة. السور التي تفتحها تُخزَّن تلقائيا أيضا.</span>
    </div>
    <div class="offline-row">
      <div class="offline-text"><span id="storageHint">يتطلب مساحة تخزين كبيرة نسبيا.</span></div>
      <button id="offlineAllBtn" class="download-btn">تنزيل الكل</button>
    </div>
    <div id="offlineAllProgress" class="progress"><span></span></div>
    <div id="offlineAllStatus" class="status"></div>
  </section>

  <div class="toolbar"><input id="search" class="search" type="search" placeholder="ابحث عن سورة" autocomplete="off"></div>
  <div class="section-title">السور</div>
  <div id="surahList" class="surah-list"></div>
</main>
<script src="./surahs.js"></script>
<script src="./home.js"></script>
</body>
</html>
